# CareBridge — localhost development stack.
#
# This file is the plain-localhost counterpart of docker-compose.yml. It runs the
# same origins without Cloudflare Tunnel or edge Nginx, and publishes every port
# on the host so a browser, the Flutter app and curl can reach them directly.
# Use docker-compose.yml instead when you deliberately need edge/topology parity.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# CompreFace is a separate stack in docker-compose.compreface.yml. See
# 05_Development/Deployment/DOCKER-LOCAL.md.
name: carebridge-dev

services:
  backend:
    build:
      context: ./05_Development/CareBridgeAPI
    image: carebridge-backend:local
    env_file:
      - ./05_Development/CareBridgeAPI/.env
    environment:
      # Browser origins of the Vite dev server published below.
      CAREBRIDGE_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      # Inside this container "localhost" is the backend itself, so every
      # sidecar URL has to be re-pointed at container DNS or the host gateway.
      AI_TRIAGE_SERVICE_URL: "http://ai-triage:8001"
      # application.yaml hard-codes carebridge.compreface.* literals, so the
      # COMPREFACE_* entries in .env do not reach the app. These relaxed-binding
      # env vars do, and env vars outrank the YAML values.
      CAREBRIDGE_COMPREFACE_ENABLED: "${CAREBRIDGE_COMPREFACE_ENABLED:-false}"
      CAREBRIDGE_COMPREFACE_BASE_URL: "${CAREBRIDGE_COMPREFACE_BASE_URL:-http://host.docker.internal:8000}"
    ports:
      - "${CAREBRIDGE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - carebridge
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  web:
    image: ${NODE_IMAGE:-node:22.17.1-alpine3.22}
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    environment:
      # Read by the browser, not by this container, so it must be the host URL.
      # Vite gives process env precedence over the bind-mounted .env file.
      VITE_API_URL: "http://localhost:8080"
    volumes:
      - ./05_Development/CareBridgeWebApp:/app
      # Keeps the Linux node_modules out of the Windows working tree.
      - web_node_modules:/app/node_modules
    ports:
      - "${CAREBRIDGE_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    networks:
      - carebridge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  ai-triage:
    build:
      context: ./05_Development/CareBridgeAITriageService
    image: carebridge-ai-triage:local
    env_file:
      - path: ./05_Development/CareBridgeAITriageService/.env
        required: false
    environment:
      # The evidence registry is the backend; it fails closed when unreachable.
      AI_TRIAGE_EVIDENCE_REGISTRY_URL: "http://backend:8080"
    ports:
      - "${CAREBRIDGE_BIND_ADDRESS:-127.0.0.1}:8001:8001"
    networks:
      - carebridge
    restart: unless-stopped

  # Optional local PostgreSQL, for working without the Supabase pooler. Start it
  # with `--profile localdb` and point the datasource tuple at it:
  #   CAREBRIDGE_DB_URL=jdbc:postgresql://postgres:5432/carebridge
  postgres:
    profiles: ["localdb"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carebridge
      POSTGRES_USER: carebridge
      POSTGRES_PASSWORD: carebridge
    ports:
      - "${CAREBRIDGE_BIND_ADDRESS:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carebridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge -d carebridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  carebridge:

volumes:
  web_node_modules:
  postgres_data:
