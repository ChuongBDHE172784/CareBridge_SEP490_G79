# CareBridge — standalone CompreFace 1.2.0 face-recognition stack.
#
# Deliberately a separate Compose project: it is optional, heavy (~2 GB RAM,
# ~3 GB of images) and has its own PostgreSQL, so it must start, stop and be
# wiped independently of the application stack.
#
#   docker compose --env-file 05_Development/CareBridgeAPI/.env \
#     -f docker-compose.compreface.yml up -d
#
# The backend reaches it over the published host port via host.docker.internal,
# so no shared Docker network is required. See
# 05_Development/Deployment/DOCKER-LOCAL.md for the wiring and first-run setup.
#
# 05_Development/Deployment/docker-compose.compreFace.yml is a different thing:
# an overlay applied on top of the staging stack. Do not run both at once.
name: carebridge-compreface

services:
  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0
    environment:
      POSTGRES_USER: ${COMPREFACE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${COMPREFACE_POSTGRES_PASSWORD:?Set COMPREFACE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${COMPREFACE_POSTGRES_DB:-frs}
    volumes:
      - compreface_postgres_data:/var/lib/postgresql/data
    networks:
      - compreface
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPREFACE_POSTGRES_USER:-postgres} -d ${COMPREFACE_POSTGRES_DB:-frs}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  compreface-core:
    image: exadel/compreface-core:1.2.0
    environment:
      ML_PORT: 3000
      IMG_LENGTH_LIMIT: ${COMPREFACE_MAX_DETECT_SIZE:-640}
      UWSGI_PROCESSES: ${COMPREFACE_UWSGI_PROCESSES:-2}
      UWSGI_THREADS: ${COMPREFACE_UWSGI_THREADS:-1}
    networks:
      - compreface
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  compreface-api:
    image: exadel/compreface-api:1.2.0
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-core:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${COMPREFACE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${COMPREFACE_POSTGRES_PASSWORD:?Set COMPREFACE_POSTGRES_PASSWORD}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/${COMPREFACE_POSTGRES_DB:-frs}
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: ${COMPREFACE_API_JAVA_OPTS:--Xmx1500m}
      PYTHON_URL: http://compreface-core:3000
      SAVE_IMAGES_TO_DB: "false"
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 10MB
      CONNECTION_TIMEOUT: ${COMPREFACE_INTERNAL_CONNECT_TIMEOUT_MS:-10000}
      READ_TIMEOUT: ${COMPREFACE_INTERNAL_READ_TIMEOUT_MS:-60000}
    networks:
      - compreface
    restart: unless-stopped

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-api:
        condition: service_started
    environment:
      POSTGRES_USER: ${COMPREFACE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${COMPREFACE_POSTGRES_PASSWORD:?Set COMPREFACE_POSTGRES_PASSWORD}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/${COMPREFACE_POSTGRES_DB:-frs}
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: "false"
      ADMIN_JAVA_OPTS: ${COMPREFACE_ADMIN_JAVA_OPTS:--Xmx1g}
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 10MB
    networks:
      - compreface
    restart: unless-stopped

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    depends_on:
      compreface-api:
        condition: service_started
      compreface-admin:
        condition: service_started
    environment:
      CLIENT_MAX_BODY_SIZE: 10M
      PROXY_READ_TIMEOUT: ${COMPREFACE_INTERNAL_READ_TIMEOUT_MS:-60000}ms
      PROXY_CONNECT_TIMEOUT: ${COMPREFACE_INTERNAL_CONNECT_TIMEOUT_MS:-10000}ms
    ports:
      # Host port the backend targets through host.docker.internal.
      - "${CAREBRIDGE_BIND_ADDRESS:-127.0.0.1}:${COMPREFACE_PORT:-8000}:80"
    networks:
      - compreface
    restart: unless-stopped

networks:
  compreface:

volumes:
  compreface_postgres_data:
