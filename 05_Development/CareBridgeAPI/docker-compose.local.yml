services:
  postgres:
    image: postgres:16-alpine
    container_name: carebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carebridge
      POSTGRES_USER: carebridge
      POSTGRES_PASSWORD: carebridge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - carebridge_postgres_data:/var/lib/postgresql/data
      - ../Deployment/database/00_provision_checklist_roles.sql:/docker-entrypoint-initdb.d/00_provision_checklist_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge -d carebridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carebridge_postgres_data:
