spring:
  config:
    activate:
      on-profile: supabase-roll-forward

  flyway:
    # The Supabase database already contains the historical chain through
    # 20260731020000. Exclude the clean-bootstrap canonical location so Flyway
    # cannot replay V20260731060000 out of order.
    locations: classpath:db/migration-roll-forward
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true
    ignore-migration-patterns: "*:missing"
