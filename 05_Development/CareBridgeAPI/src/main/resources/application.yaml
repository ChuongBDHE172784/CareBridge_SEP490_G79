spring:
  application:
    name: backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false
    clean-disabled: true
    out-of-order: true
    ignore-migration-patterns: "*:missing"

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

carebridge:
  dev-seed:
    enabled: ${CAREBRIDGE_DEV_SEED_ENABLED:false}
    password: ${CAREBRIDGE_DEV_SEED_PASSWORD:Test@1234}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    otp:
      expiration-seconds: 300
      max-attempts: 5
  auth:
    federated-enabled: ${AUTH_FEDERATED_ENABLED:true}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    auth-emulator-enabled: ${CAREBRIDGE_FIREBASE_AUTH_EMULATOR_ENABLED:false}
    auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
    # UC-144D Direct Consult Chat & Call — Cloud Firestore signaling (ADR-DCC-004).
    # Shares the Firebase credentials configured under fcm; enable explicitly because
    # Firestore signaling is a hard requirement of this feature, unlike FCM.
    firestore:
      enabled: ${CAREBRIDGE_FIREBASE_FIRESTORE_ENABLED:false}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    timeout-ms: 5000
    max-context-chunks: 5
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-1.5-flash
  zego:
    app-id: ${ZEGO_APP_ID:0}
    server-secret: ${ZEGO_SERVER_SECRET:}
    token-ttl-seconds: 3600

  supabase:
    url: ${SUPABASE_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:carebridge}
  mail:
    from-address: ${MAIL_USERNAME:noreply@carebridge.app}
    from-name: "CareBridge"

  fcm:
    enabled: ${CAREBRIDGE_FCM_ENABLED:false}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    use-application-default-credentials: ${FIREBASE_USE_APPLICATION_DEFAULT_CREDENTIALS:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-id: ${FIREBASE_SERVICE_ACCOUNT_ID:}

  directchat:
    call-ring-timeout-seconds: ${DIRECTCHAT_CALL_RING_TIMEOUT_SECONDS:45}
    firebase-event-retention-hours: ${DIRECTCHAT_FIREBASE_EVENT_RETENTION_HOURS:24}

  consultation-request:
    expiry-hours: ${CONSULTATION_REQUEST_EXPIRY_HOURS:48}
    expiry-job-delay-ms: ${CONSULTATION_REQUEST_EXPIRY_JOB_DELAY_MS:60000}

  notification:
    consultation-request-outbox-delay-ms: ${CONSULTATION_REQUEST_OUTBOX_DELAY_MS:5000}

ai:
  triage-service:
    url: ${AI_TRIAGE_SERVICE_URL:http://localhost:8001}
    request-timeout-ms: ${AI_TRIAGE_REQUEST_TIMEOUT_MS:15000}
    internal-api-key: ${AI_TRIAGE_INTERNAL_API_KEY:}
