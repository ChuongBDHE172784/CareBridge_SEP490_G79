
  spring:
    application:
      name: backend

    datasource:
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
      username: ${SPRING_DATASOURCE_USERNAME:postgres.wqsunmakzdaxwyknegkq}
      password: ${SPRING_DATASOURCE_PASSWORD:sdSjTLr8eWTgA7WI}
      driver-class-name: org.postgresql.Driver

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true


    docker:
      compose:
         enabled: false
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: true

  carebridge:
    security:
      jwt:
        secret: ${JWT_SECRET:carebridge-local-dev-secret-key-must-be-at-least-32-characters}
        access-token-expiration-ms: 900000
        refresh-token-expiration-ms: 604800000
      otp:
        expiration-seconds: 300
        max-attempts: 5

    expert:
      price:
        min: ${EXPERT_PRICE_BAND_MIN:50000}
        max: ${EXPERT_PRICE_BAND_MAX:500000}
        default-duration-minutes: 30

    payment:
      mock:
        enabled: ${PAYMENT_MOCK_ENABLED:true}
      gateway:
        vnpay:
          url: ${VNPAY_URL:https://mock.vnpay.vn}
          tmn-code: ${VNPAY_TMN_CODE:TEST_TMN}
          hash-secret: ${VNPAY_HASH_SECRET:test-secret}

    realtime:
      provider: ${REALTIME_PROVIDER:mock}
      zego:
        app-id: ${ZEGO_APP_ID:0}
        server-secret: ${ZEGO_SERVER_SECRET:test-secret}

