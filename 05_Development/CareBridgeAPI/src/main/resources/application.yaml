spring:
  application:
    name: backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false
    clean-disabled: true
    out-of-order: true
    ignore-migration-patterns: "*:missing"

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

carebridge:
  dev-seed:
    enabled: ${CAREBRIDGE_DEV_SEED_ENABLED:false}
    password: ${CAREBRIDGE_DEV_SEED_PASSWORD:Test@1234}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    otp:
      expiration-seconds: 300
      max-attempts: 5
  gemini:
    api-key: ${GEMINI_API_KEY:}
    timeout-ms: 5000
    max-context-chunks: 5
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-1.5-flash

  supabase:
    url: ${SUPABASE_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:carebridge}
  mail:
    from-address: ${MAIL_USERNAME:noreply@carebridge.app}
    from-name: "CareBridge"

  fcm:
    enabled: ${CAREBRIDGE_FCM_ENABLED:false}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
