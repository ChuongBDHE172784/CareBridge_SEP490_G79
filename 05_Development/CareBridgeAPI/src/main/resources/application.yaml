spring:
  application:
    name: backend

  datasource:
    # Supabase Database alternative (currently inactive).
    # To restore it, uncomment SUPABASE_DB_* in .env, then replace the active
    # CAREBRIDGE_DB_* block below with these three lines in one edit:
    # url: ${SUPABASE_DB_URL}
    # username: ${SUPABASE_DB_USERNAME}
    # password: ${SUPABASE_DB_PASSWORD}

    # Generic datasource contract using local Docker PostgreSQL defaults (currently active):
    url: ${CAREBRIDGE_DB_URL:jdbc:postgresql://localhost:5433/carebridge}
    username: ${CAREBRIDGE_DB_USERNAME:carebridge}
    password: ${CAREBRIDGE_DB_PASSWORD:carebridge}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000

  flyway:
    enabled: false
    clean-disabled: true
    out-of-order: true
    ignore-migration-patterns: "*:missing"

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB

carebridge:
  dev-seed:
    enabled: ${CAREBRIDGE_DEV_SEED_ENABLED:false}
    password: ${CAREBRIDGE_DEV_SEED_PASSWORD:Test@1234}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    otp:
      expiration-seconds: 300
      max-attempts: 5
  auth:
    federated-enabled: ${AUTH_FEDERATED_ENABLED:true}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    auth-emulator-enabled: ${CAREBRIDGE_FIREBASE_AUTH_EMULATOR_ENABLED:false}
    auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
    # UC-144D Direct Consult Chat & Call — Cloud Firestore signaling (ADR-DCC-004).
    # Shares the Firebase credentials configured under fcm; enable explicitly because
    # Firestore signaling is a hard requirement of this feature, unlike FCM.
    firestore:
      enabled: ${CAREBRIDGE_FIREBASE_FIRESTORE_ENABLED:false}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    timeout-ms: 5000
    max-context-chunks: 5
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-1.5-flash
  zego:
    app-id: ${ZEGO_APP_ID:0}
    server-secret: ${ZEGO_SERVER_SECRET:}
    token-ttl-seconds: 3600

  supabase:
    url: ${SUPABASE_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:carebridge}
  mail:
    from-address: ${MAIL_USERNAME:noreply@carebridge.app}
    from-name: "CareBridge"

  fcm:
    enabled: ${CAREBRIDGE_FCM_ENABLED:false}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    use-application-default-credentials: ${FIREBASE_USE_APPLICATION_DEFAULT_CREDENTIALS:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-id: ${FIREBASE_SERVICE_ACCOUNT_ID:}

  directchat:
    call-ring-timeout-seconds: ${DIRECTCHAT_CALL_RING_TIMEOUT_SECONDS:45}
    firebase-event-retention-hours: ${DIRECTCHAT_FIREBASE_EVENT_RETENTION_HOURS:24}

  storage:
    provider: ${FILE_STORAGE_PROVIDER:cloudinary}
    private-provider: ${PRIVATE_FILE_STORAGE_PROVIDER:r2}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY_ID:}
      secret-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:${R2_BUCKET_NAME:carebridge-private}}
      region: ${R2_REGION:auto}

  compreface:
    enabled: ${COMPREFACE_ENABLED:false}
    base-url: ${COMPREFACE_BASE_URL:http://localhost:8000}
    detection-api-key: ${COMPREFACE_DETECTION_API_KEY:}
    verification-api-key: ${COMPREFACE_VERIFICATION_API_KEY:}
    # Deprecated: kept for backwards compatibility if needed
    # api-key: ${COMPREFACE_API_KEY:}
    similarity-threshold: ${COMPREFACE_SIMILARITY_THRESHOLD:0.75}
    det-prob-threshold: ${COMPREFACE_DET_PROB_THRESHOLD:0.7}
    detection-limit: ${COMPREFACE_DETECTION_LIMIT:2}
    connect-timeout-ms: ${COMPREFACE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${COMPREFACE_READ_TIMEOUT_MS:8000}

ai:
  triage-service:
    url: ${AI_TRIAGE_SERVICE_URL:http://localhost:8001}
    request-timeout-ms: ${AI_TRIAGE_REQUEST_TIMEOUT_MS:15000}
    internal-api-key: ${AI_TRIAGE_INTERNAL_API_KEY:}
