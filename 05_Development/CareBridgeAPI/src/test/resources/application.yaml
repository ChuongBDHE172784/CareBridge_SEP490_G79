spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password: test
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        # Rebuild audit_events with its canonical shape right after Hibernate's schema
        # export (see h2-canonical-audit-events.sql). Import files only run for
        # create/create-drop, so PostgreSQL contexts (ddl-auto=validate + Flyway) are
        # untouched.
        hbm2ddl:
          import_files: /h2-canonical-audit-events.sql
          import_files_sql_extractor: org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.orm: DEBUG
    com.carebridge.backend: DEBUG

carebridge:
  features:
    # Background reconciliation is tested explicitly; keep unrelated Spring
    # test contexts deterministic and free from scheduled database writes.
    checklist-distribution-v2: false
  triage:
    disclaimer:
      # CB-TRIAGE-CONSENT-IMP-001-TEST FX-005 — synthetic single-oracle values (L4).
      version: AI_TRIAGE_DISCLAIMER_V1
      text: SYNTHETIC DISCLAIMER TEXT V1
  zego:
    app-id: 1
    server-secret: synthetic-test-secret
    token-ttl-seconds: 3600
  storage:
    private-provider: cloudinary
  security:
    jwt:
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    otp:
      expiration-seconds: 300
      max-attempts: 5
  fcm:
    enabled: false
    credentials-base64: ""
  gemini:
    enabled: false
    api-key: ""
    timeout-ms: 1000
    connect-timeout-ms: 500
    base-url: http://localhost:9999
    model: gemini-1.5-flash
    moderation:
      timeout-ms: 1000
      max-attempts: 2
      worker-delay-ms: 60000
      batch-size: 2
      review-confidence-threshold: 0.5
      stale-processing-minutes: 10

ai:
  triage-service:
    url: http://localhost:8001

# Keep integration contexts aligned with the production readiness contract.
# src/test/resources/application.yaml shadows the main resource in tests.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
          show-components: always
          show-details: never
