map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_cf_connecting_ip $carebridge_client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

server {
    listen 8080 default_server;
    server_name _;

    return 444;
}

server {
    listen 8080;
    server_name ${CAREBRIDGE_PORTAL_HOSTNAME};

    allow ${CAREBRIDGE_CLOUDFLARED_IP};
    deny all;

    client_max_body_size 16m;

    location ^~ /api/ {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://web-dev:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 8080;
    server_name ${CAREBRIDGE_API_HOSTNAME};

    allow ${CAREBRIDGE_CLOUDFLARED_IP};
    deny all;

    client_max_body_size 16m;

    location ^~ /actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $carebridge_client_ip;
        proxy_set_header X-Real-IP $carebridge_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
