# nginx-edge cho kiến trúc A record: Cloudflare proxy nói chuyện trực tiếp với
# EC2 qua HTTPS, không có cloudflared ở giữa.
#
# Khác edge-api.conf / edge-server.conf ở hai điểm: TLS kết thúc tại đây thay vì
# ở cloudflared, và danh sách nguồn tin cậy là dải IP của Cloudflare thay vì một
# IP tĩnh trong Docker network.

# Cloudflare là proxy, nên $remote_addr luôn là IP của Cloudflare. Khai báo các
# dải này để nginx lấy IP thật của người dùng từ header CF-Connecting-IP.
# Nếu KHÔNG khai báo, mọi log và mọi rate-limit sẽ nhìn thấy một nhúm IP
# Cloudflare thay vì người dùng thật.
#
# Danh sách cập nhật lần cuối 2026-08-08. Kiểm tra lại bằng:
#   curl -s https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Gõ thẳng IP của EC2, hoặc bất kỳ hostname nào không phải API, sẽ rơi vào đây
# và bị ngắt kết nối không phản hồi — origin không lộ ra thứ gì.
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    # Lặp lại chỉ thị đã khai ở tầng http bên trên. Nginx vốn đã kế thừa nó xuống
    # đây nên về hành vi là thừa, nhưng nó giữ khối server này tự đứng vững nếu
    # sau này bị tách sang file khác — và đó cũng là điều Semgrep kiểm được, vì
    # luật quét trong phạm vi từng khối server chứ không lần theo kế thừa.
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# API — https://${CAREBRIDGE_API_HOSTNAME}
server {
    listen 8443 ssl;
    http2 on;
    # Đặt trên server_name có chủ đích: bộ so khớp "generic" của Semgrep đếm ngoặc
    # nhọn, nên dấu { trong ${CAREBRIDGE_API_HOSTNAME} làm nó tưởng khối server
    # đóng ngay tại đó và không thấy gì khai báo phía dưới. Nginx không quan tâm
    # thứ tự chỉ thị, nên đây là cách để công cụ đọc được đúng thứ đang có.
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name ${CAREBRIDGE_API_HOSTNAME};

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;

    # Khớp với spring.servlet.multipart.max-file-size 5MB cộng phần dư cho
    # multipart overhead và ảnh khuôn mặt.
    client_max_body_size 16m;

    server_tokens off;

    # Actuator không được lộ ra Internet. Health check gọi từ trong Docker
    # network, không qua đường này.
    location ^~ /actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Xoá các header forwarding do client tự đặt TRƯỚC khi set lại, để một
        # CF-Connecting-IP giả mạo không đi lọt vào application.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
