map $http_cf_connecting_ip $carebridge_client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

# Anything that is not one of the two published hostnames is dropped without a
# response, so a direct hit on the origin IP reveals nothing.
server {
    listen 8080 default_server;
    server_name _;

    return 444;
}

# Portal — https://${CAREBRIDGE_PORTAL_HOSTNAME}
server {
    listen 8080;
    server_name ${CAREBRIDGE_PORTAL_HOSTNAME};

    allow ${CAREBRIDGE_CLOUDFLARED_IP};
    deny all;

    client_max_body_size 16m;

    # The portal origin serves static assets only. API and management traffic
    # belong to the API hostname.
    location ^~ /api/ {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $carebridge_client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# API — https://${CAREBRIDGE_API_HOSTNAME}
server {
    listen 8080;
    server_name ${CAREBRIDGE_API_HOSTNAME};

    allow ${CAREBRIDGE_CLOUDFLARED_IP};
    deny all;

    client_max_body_size 16m;

    # Actuator stays unreachable from the internet; probe it from inside the
    # Docker network instead.
    location ^~ /actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Clear client-controlled forwarding headers before adding our own, so a
        # spoofed CF-Connecting-IP cannot reach the application.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $carebridge_client_ip;
        proxy_set_header X-Real-IP $carebridge_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
