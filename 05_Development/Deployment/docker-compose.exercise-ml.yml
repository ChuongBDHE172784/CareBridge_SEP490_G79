services:
  exercise-correction:
    build:
      context: ./05_Development/MachineLearning/MediaPipe_Posture/exercise_correction_sidecar
    image: carebridge-exercise-correction:demo
    environment:
      EXERCISE_MODEL_DIR: /app/models
      EXERCISE_MODEL_MANIFEST: /app/models/SHA256SUMS
    expose:
      - "8002"
    networks:
      - exercise-inference
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped

  backend:
    environment:
      CAREBRIDGE_EXERCISE_CORRECTION_ENABLED: "true"
      EXERCISE_CORRECTION_SERVICE_URL: http://exercise-correction:8002
    networks:
      - exercise-inference
    depends_on:
      exercise-correction:
        condition: service_healthy

networks:
  exercise-inference:
    internal: true
