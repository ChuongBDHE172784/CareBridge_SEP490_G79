services:
  ai-service:
    image: ${AI_IMAGE:?Set AI_IMAGE to an immutable name@sha256 digest}
    restart: unless-stopped
    # Never inject the Backend env file into this container. Compose may read
    # its deployment env for interpolation, but the AI process receives only
    # this explicit least-privilege allowlist.
    environment:
      AI_TRIAGE_EVIDENCE_REGISTRY_URL: ${AI_TRIAGE_EVIDENCE_REGISTRY_URL:?Set the Backend evidence-registry URL}
      AI_TRIAGE_INTERNAL_API_KEY: ${AI_TRIAGE_INTERNAL_API_KEY:?Set the shared evidence-registry internal key}
      AI_TRIAGE_EVIDENCE_REGISTRY_CACHE_SECONDS: ${AI_TRIAGE_EVIDENCE_REGISTRY_CACHE_SECONDS:-300}
      AI_TRIAGE_SERVICE_TIMEOUT_SECONDS: ${AI_TRIAGE_SERVICE_TIMEOUT_SECONDS:-7}
      AI_TRIAGE_REALTIME_TIMEOUT_SECONDS: ${AI_TRIAGE_REALTIME_TIMEOUT_SECONDS:-3.5}
      AI_TRIAGE_EVIDENCE_CACHE_TTL_DAYS: ${AI_TRIAGE_EVIDENCE_CACHE_TTL_DAYS:-30}
      GEMINI_ENABLED: ${AI_GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${AI_GEMINI_TIMEOUT_SECONDS:-6}
      GEMINI_MAX_RETRIES: ${AI_GEMINI_MAX_RETRIES:-1}
      GEMINI_TEMPERATURE: ${AI_GEMINI_TEMPERATURE:-0.2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  backend:
    image: ${BACKEND_IMAGE:?Set an immutable backend image tag}
    restart: unless-stopped
    # Defaults to the server-only .env; BACKEND_ENV_FILE=/dev/null enables syntax checks without secrets.
    env_file: ["${BACKEND_ENV_FILE:-.env}"]
    environment:
      AI_TRIAGE_SERVICE_URL: http://ai-service:8001
    ports: ["${BACKEND_PORT:-8080}:8080"]
    depends_on:
      ai-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  web:
    image: ${WEB_IMAGE:?Set an immutable web image tag}
    restart: unless-stopped
    ports: ["${WEB_PORT:-8081}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
