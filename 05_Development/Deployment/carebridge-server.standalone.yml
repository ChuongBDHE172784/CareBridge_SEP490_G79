      GEMINI_MODEL: gemini-3.5-flash
      GEMINI_TIMEOUT_SECONDS: 6
      GEMINI_MAX_RETRIES: 1
      GEMINI_TEMPERATURE: 0.2
    expose:
      - "8001"
    networks:
      - ai-origin
      - service-egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 30s
