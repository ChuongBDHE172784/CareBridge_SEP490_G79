# CareBridge — server deployment stack (AWS EC2 / VM).
#
# Implements the runtime architecture: Cloudflare Tunnel terminates public
# traffic, cloudflared dials out from the VM so no inbound port is opened, and
# nginx-edge is the only thing the tunnel can reach. Nothing here publishes a
# port on the host.
#
#   Internet -> Cloudflare -> cloudflared -> nginx-edge -+-> web:8080     (portal)
#                                                        +-> backend:8080 (API)
#
# CompreFace is Container B in docker-compose.server.compreface.yml; it attaches
# to the internal carebridge-face-origin network created here and is never
# published. Supabase, Gemini, Firebase, R2 and Cloudinary stay managed and
# external; only the two egress-capable services can reach them.
#
#   docker compose --env-file 05_Development/Deployment/.env.server \
#     -f docker-compose.server.yml up -d --build
#
# See 05_Development/Deployment/DEPLOY-SERVER.md.
name: carebridge-server

services:
  ai-triage:
    # Set AI_IMAGE to a registry digest to deploy a CI-built image instead of
    # building on the VM. The build block is ignored by `docker compose pull`.
    image: carebridge-ai-triage:server
    build:
      context: ./05_Development/CareBridgeAITriageService
    # Least privilege: this container never receives the backend env file, only
    # the values it actually needs.
    environment:
      AI_TRIAGE_EVIDENCE_REGISTRY_URL: "http://backend:8080"
      AI_TRIAGE_INTERNAL_API_KEY: carebridge
      AI_TRIAGE_EVIDENCE_REGISTRY_CACHE_SECONDS: 300
