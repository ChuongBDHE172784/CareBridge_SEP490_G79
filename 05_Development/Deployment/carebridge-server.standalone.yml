      EXERCISE_MODEL_MANIFEST: /app/models/SHA256SUMS
    expose:
      - "8002"
    # Pure inference over bundled models: no credentials, no egress.
    networks:
      - exercise-origin
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
