name: carebridge-api-production

services:
  ai-service:
    image: ${AI_IMAGE:?Set AI_IMAGE to an immutable image@sha256 digest}
    environment:
      AI_TRIAGE_EVIDENCE_REGISTRY_URL: ${AI_TRIAGE_EVIDENCE_REGISTRY_URL:?Set the Backend evidence-registry URL}
      AI_TRIAGE_INTERNAL_API_KEY: ${AI_TRIAGE_INTERNAL_API_KEY:?Set the shared internal key}
      GEMINI_ENABLED: ${AI_GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-2.5-flash}
    expose:
      - "8001"
    networks:
      - ai-origin
      - service-egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable image@sha256 digest}
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      AI_TRIAGE_SERVICE_URL: http://ai-service:8001
      CAREBRIDGE_CORS_ALLOWED_ORIGINS: ${CAREBRIDGE_CORS_ALLOWED_ORIGINS:?Set exact GitLab Pages portal origin}
    expose:
      - "8080"
    networks:
      - backend-origin
      - ai-origin
      - service-egress
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  nginx-edge:
    image: ${EDGE_NGINX_IMAGE:?Set EDGE_NGINX_IMAGE to an immutable nginx-unprivileged image@sha256 digest}
    environment:
      CAREBRIDGE_API_HOSTNAME: ${CAREBRIDGE_API_HOSTNAME:?Set the exact production API hostname}
      CAREBRIDGE_CLOUDFLARED_IP: ${CAREBRIDGE_CLOUDFLARED_IP:-172.31.0.2}
    volumes:
      - ./nginx/edge-api.conf:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "8080"
    networks:
      - tunnel
      - backend-origin
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://backend:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE to an immutable cloudflared image@sha256 digest}
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      tunnel:
        ipv4_address: ${CAREBRIDGE_CLOUDFLARED_IP:-172.31.0.2}
    depends_on:
      nginx-edge:
        condition: service_healthy
    restart: unless-stopped

networks:
  tunnel:
    ipam:
      config:
        - subnet: ${CAREBRIDGE_TUNNEL_SUBNET:-172.31.0.0/29}
  backend-origin:
    internal: true
  ai-origin:
    internal: true
  service-egress:

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:?Set path to the Cloudflare tunnel token file}
