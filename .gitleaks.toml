title = "CareBridge secret gate"

# Project-owned gitleaks entry point, paired with .semgrep.yml. Add only reviewed,
# narrow exclusions here.
#
# ai_evaluation_gitleaks only reads 06_Testing/CareBridgeAIEvaluation. The
# credentials this project actually leaked sat in 05_Development/Deployment, which
# that job never opened. The gitleaks_repo job in .gitlab-ci.yml scans the whole
# tree instead, and this file is its allowlist.
#
# A first run against the current tree reported 36 findings, every one of them a
# false positive. Without these exclusions the gate would be red on day one, and a
# gate that is always red is one the team learns to ignore within a week. Each
# entry below was opened and checked by hand.

[extend]
useDefault = true

[allowlist]
description = "Hand-checked cases confirmed not to be live credentials"

paths = [
  # Every flagged value here is EMPTY. gitleaks matched the string "API_KEY" in the
  # variable name, not any value.
  '''.*\.env\.example$''',

  # CocoaPods SHA checksums, not keys.
  '''.*/Podfile\.lock$''',

  # Firebase client keys. Google publishes these on purpose: they identify the app,
  # they are not secrets, and anyone who downloads the app can read them. What
  # protects the data is Firebase Security Rules plus API key restrictions in the
  # Google Cloud console — not keeping this string out of the repository.
  '''05_Development/CareBridgeMobileApp/lib/firebase_options\.dart$''',
  '''05_Development/CareBridgeMobileApp/web/firebase-messaging-sw\.js$''',
  '''05_Development/CareBridgeMobileApp/android/app/google-services\.json$''',

  # Fixture values in tests and in a stored test report. These are the widest
  # entries here, so they lean on a second net: trivy_fs runs --scanners secret over
  # the entire tree with no path exclusions at all.
  '''05_Development/CareBridgeAPI/src/test/java/.*''',
  '''05_Development/CareBridgeAITriageService/tests/.*''',
  '''06_Testing/UnitTesting/report-tools/mobile-test\.json$''',

  # Authorization header examples inside design documents.
  '''04_Implement/.*_TDS\.md$''',

  # Arrived with the dev merge. Both hold the shared synthetic test-account
  # password, not a production credential.
  #
  # DevDataSeeder cannot reach production: it is gated twice, by
  # @Profile("dev & !prod") and by @ConditionalOnProperty on carebridge.dev-seed,
  # so the value only ever creates throwaway users on a developer machine.
  '''05_Development/CareBridgeAPI/src/main/java/com/carebridge/backend/common/dev/DevDataSeeder\.java$''',

  # System-test preflight script; signs in as the seeded test account to check the
  # environment answers before a manual test run.
  '''06_Testing/SystemTesting/auth-preflight\.sh$''',

  # Mobile and web auth test fixtures. Same shape as the backend test tree above,
  # which is already allowlisted; trivy_fs still scans these with no exclusions.
  '''05_Development/CareBridgeMobileApp/test/.*''',
  '''05_Development/CareBridgeWebApp/src/.*\.test\.(ts|tsx)$''',

  # Checklist database backups containing synthetic distribution_key SHA-256 hashes,
  # not API keys or secrets.
  '''05_Development/Database/backup/.*''',
  '''05_Development/Database/.*backup.*''',

  # Vendored upstream Gadgetbridge (GPL, ~6.9k files). None of it is ours and none
  # of it carries a CareBridge credential; every hit here is the generic-api-key
  # rule firing on Android preference plumbing, mostly android:key="..." attributes
  # in res/xml settings screens plus two device-protocol constants. Checked by hand:
  # 32 of the 34 findings that turned this gate red came from this tree alone.
  # trivy_fs still scans it with no path exclusions.
  '''05_Development/Gadgetbridge/.*''',
]

# The internal-key header in these curl examples is the literal string the code
# already publishes as its development default -- application.yaml falls back to it
# and the Python service accepts it -- so the documentation is not disclosing
# anything the repository does not already state twice. The deployed stack refuses
# to start without a real AI_TRIAGE_INTERNAL_API_KEY from .env.server, which is
# gitignored, so this value never reaches production.
[[rules]]
id = "curl-auth-header"
[rules.allowlist]
description = "Local-development curl examples using the documented default internal key"
paths = [
  '''05_Development/CareBridgeAITriageService/README\.md$''',
  '''docs/AI/01_THIET_KE_KIEN_TRUC_AI_RAG_VA_BAO_VE_DO_AN\.md$''',
]

