            padding: 0;

            position: relative;

        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .animate-fade-in {

<div class="mobile-container flex flex-col relative bg-surface-container-low">

<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-container-margin-mobile pt-2 pb-6 flex flex-col gap-6">

</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Dừng gói tư vấn?</h2>

</div>

<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">videocam</span>

<div class="h-[1px] w-full bg-outline-variant/30"></div>

                            </span>

</div>
<div class="h-[1px] w-full bg-outline-variant/30"></div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">payments</span>
                                Mức phí
                            </span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">500,000đ</span>
</div>
</div>
</div>

<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">

                    </p>
</div>

<button class="w-full h-12 bg-error text-on-error rounded-full font-body-lg text-body-lg flex items-center justify-center gap-2 hover:bg-error/90 transition-colors shadow-[0_4px_12px_rgba(90,70,63,0.15)] active:scale-95 duration-150">
