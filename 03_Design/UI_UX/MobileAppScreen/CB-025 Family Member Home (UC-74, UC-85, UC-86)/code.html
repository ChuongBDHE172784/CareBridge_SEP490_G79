<!DOCTYPE html>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            font-variation-settings: 'FILL' 1;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen pb-24 font-body-md">
<!-- Top App Bar -->
<header class="docked full-width top-0 bg-background flex justify-between items-center px-safe-margin h-touch-target-min w-full sticky z-40">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden">

</div>
<div>
<h1 class="font-headline-lg text-headline-lg text-primary">Chào bà ngoại,</h1>
</div>
</div>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 rounded-full bg-surface-container-low">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<main class="px-safe-margin pt-stack-md flex flex-col gap-stack-lg">
<!-- Quick Shortcuts Bento -->
<section>
<div class="grid grid-cols-4 gap-3">
<button class="flex flex-col items-center gap-2 group active:scale-95 transition-transform duration-200">
<div class="w-14 h-14 rounded-[1.2rem] bg-primary-container/20 flex items-center justify-center text-primary group-hover:bg-primary-container/30 transition-colors">
<span class="material-symbols-outlined fill">check_circle</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant text-center leading-tight">Nhiệm vụ</span>
</button>
<button class="flex flex-col items-center gap-2 group active:scale-95 transition-transform duration-200">
<div class="w-14 h-14 rounded-[1.2rem] bg-secondary-container/30 flex items-center justify-center text-secondary group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined fill">calendar_today</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant text-center leading-tight">Lịch</span>
</button>
<button class="flex flex-col items-center gap-2 group active:scale-95 transition-transform duration-200">
<div class="w-14 h-14 rounded-[1.2rem] bg-error-container/40 flex items-center justify-center text-error group-hover:bg-error-container/60 transition-colors">
<span class="material-symbols-outlined fill">warning</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant text-center leading-tight">Cảnh báo</span>
</button>
<button class="flex flex-col items-center gap-2 group active:scale-95 transition-transform duration-200">
<div class="w-14 h-14 rounded-[1.2rem] bg-tertiary-container/30 flex items-center justify-center text-tertiary group-hover:bg-tertiary-container/50 transition-colors">
<span class="material-symbols-outlined fill">share</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant text-center leading-tight">Dữ liệu chia sẻ</span>
</button>
</div>
</section>
<!-- Tasks Card -->
<section>
<h2 class="font-headline-md text-headline-md text-on-background mb-stack-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary">assignment</span>
                Việc cần làm sắp tới
            </h2>
<div class="bg-surface-container-lowest rounded-[24px] p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] border border-surface-container-low">
<div class="flex items-start gap-4">
<button class="w-6 h-6 rounded-full border-2 border-outline mt-1 flex-shrink-0 flex items-center justify-center text-transparent hover:border-primary hover:text-primary transition-colors"></button>
<div class="flex-1">
<p class="font-body-lg text-body-lg text-on-background">Mua bỉm cho bé Mỡ</p>
<div class="flex items-center gap-2 mt-2">
<span class="inline-flex items-center gap-1 bg-surface-container-high px-2 py-1 rounded-md font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">shopping_cart</span>
                                Mua sắm
                            </span>
</div>
</div>
</div>
</div>
</section>
<!-- Schedule Card -->
<section>
<h2 class="font-headline-md text-headline-md text-on-background mb-stack-sm flex items-center gap-2">
<span class="material-symbols-outlined text-secondary">event</span>
                Lịch chăm sóc
            </h2>
<div class="bg-surface-container-lowest rounded-[24px] p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] border border-surface-container-low relative overflow-hidden">
<div class="absolute top-0 left-0 w-2 h-full bg-secondary-container"></div>
<div class="pl-2">
<p class="font-label-md text-label-md text-secondary mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                        10:00 sáng mai
                    </p>
<p class="font-body-lg text-body-lg text-on-background font-medium">Khám định kỳ</p>
</div>
</div>
</section>
<!-- Notification Card -->
<section>
<h2 class="font-headline-md text-headline-md text-on-background mb-stack-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary">notifications_active</span>
                Thông báo mới nhất
            </h2>
<div class="bg-primary-container/10 rounded-[24px] p-5 border border-primary-container/20">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined fill">bedtime</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary mb-1">Mới đây</p>
<p class="font-body-lg text-body-lg text-on-background">Bé Mỡ đã ngủ ngon</p>
</div>
</div>
</div>
</section>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-stack-sm bg-surface shadow-[0px_-4px_20px_rgba(90,70,63,0.06)] rounded-t-lg pb-safe-margin md:hidden">
<button class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-xl px-4 py-2 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined fill">home</span>
<span class="font-label-md text-label-md mt-1">Tổng quan</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container opacity-70 hover:bg-surface-container-low transition-colors rounded-xl px-2 py-2 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md mt-1">Nhóm</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container opacity-70 hover:bg-surface-container-low transition-colors rounded-xl px-2 py-2 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-md text-label-md mt-1">Lịch</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container opacity-70 hover:bg-surface-container-low transition-colors rounded-xl px-2 py-2 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined">notifications</span>
<span class="font-label-md text-label-md mt-1">Thông báo</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container opacity-70 hover:bg-surface-container-low transition-colors rounded-xl px-2 py-2 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md mt-1">Hồ sơ</span>
