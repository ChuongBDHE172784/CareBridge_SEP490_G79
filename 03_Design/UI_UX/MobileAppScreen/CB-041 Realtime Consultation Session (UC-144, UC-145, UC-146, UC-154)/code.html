<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Realtime Consultation Session</title>

                        "on-primary": "#ffffff",

                        "surface-tint": "#845143",
                        "outline": "#84736f",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#271812",
                        "on-background": "#271812",

                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"

                    "spacing": {

                    "fontFamily": {
                        "body-lg": ["Lexend"],
                        "button": ["Lexend"],

                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                },
            },
        }

<style>
        body {
            background-color: #f6f1ec; /* Level 0 Canvas from guidance */
        }
        /* Mobile Frame for standard preview */
        .mobile-frame {
            width: 390px;
            height: 844px;
            margin: 0 auto;
            background-color: #fff8f6; /* bg-background */
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        /* Video background styling */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(39, 24, 18, 0.4) 0%, rgba(39, 24, 18, 0) 20%, rgba(39, 24, 18, 0) 70%, rgba(39, 24, 18, 0.8) 100%);
            z-index: 10;
        }

        .content-layer {
            position: relative;
            z-index: 20;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-surface">
<div class="mobile-frame">
<!-- Video Background (Expert) -->
<div class="video-container" data-alt="A warm, professional female pediatrician in a bright, modern clinic setting, looking directly at the camera with a reassuring smile. Soft, natural light fills the room, highlighting the clean, organized background with subtle medical elements. The overall tone is nurturing, reliable, and organic minimalism." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBk4LiUfdOE91D6rJqwDop-SqjWsTIMmxGLIrCe7ULshqGHByVu2lgzcviiD5M-uImkw0eFA8xc4RQILWj42_Cd9WWziH-Zzmd5sRa1FIW6TPnVfHl1jZTwHHeSpKTwaqKWM2X6nujsA8TNHE6s4F-NcSzIQ59v6f7NDW-um6H_p_Vts_WL3RAro2LDAs4RHr_zxAoIDXu0eBM28RA_M7pU1LlIkC2iZwIMt4hHQeGN5ugCwNMR2uWci2_-aOEIfDbIorJN2HF8EpU')">
<!-- Self View (User) - Picture in Picture -->
<div class="absolute top-24 right-safe-margin w-28 h-40 rounded-[16px] overflow-hidden shadow-[0px_4px_20px_rgba(90,70,63,0.12)] border-2 border-surface z-30" data-alt="A close-up of a tired but attentive mother holding a sleeping infant. Soft, warm indoor lighting creates a cozy, nurturing atmosphere. The color palette features warm earth tones, soft whites, and deep cocoa shadows, aligning with an organic minimalist aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCV0m0FQbV13sAG8dXncdB_DoNTKtGmvP8ktAcSVNWqXNkUia0iuw6Tjh4jxgq486DBQ8R7954F57hSP4xlNE3xolyLseXb8dx-2OwRqtrGy5VHx6h-2Ds1j4Lm7wMFikGxRLCC1OmUKF-KgLGC1r1hCIXfSLk-hewza0O47OgEEvcCaJ_ZADWgp4cjLaE1Hlzg0i9PVUUQTse3tqHUIPOfm3A1iFF9rnVxqv_Fht3rj8ffmRRQM7YBFa4tmi82J87s2iJAx4Vx1Mo')">
</div>
</div>
<!-- Gradient Overlay for readability -->
<div class="video-overlay pointer-events-none"></div>
<div class="content-layer">
<!-- Top App Bar - Transparent for Video Mode -->
<div class="flex justify-between items-center px-safe-margin h-touch-target-min w-full pt-10">
<!-- Back Action implied by 'Minimize' or 'Back' icon, though not explicitly requested, standard for such screens -->
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface/20 backdrop-blur-md text-on-primary hover:bg-surface/30 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">keyboard_arrow_down</span>
</button>
<!-- Health Summary Shortcut -->
<button class="h-10 px-4 flex items-center gap-2 rounded-full bg-surface-container-highest/80 backdrop-blur-md text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">medical_information</span>
<span class="font-label-md text-label-md">Hồ sơ bé</span>
</button>
</div>
<!-- Bottom Controls Area -->
<div class="px-safe-margin pb-10 pt-safe-margin w-full flex flex-col gap-stack-lg">
<!-- Participant Info & Timer -->
<div class="flex flex-col gap-1">
<h1 class="font-headline-md text-headline-md text-on-primary">BS. Nguyễn Thu Hà</h1>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-[#E8A87C] animate-pulse"></span>
<span class="font-body-md text-body-md text-on-primary/90">04:23</span>
</div>
</div>
<!-- Control Bar -->
<div class="flex items-center justify-between w-full bg-surface/10 backdrop-blur-xl p-4 rounded-[24px] shadow-[0px_8px_24px_rgba(90,70,63,0.12)] border border-surface/20">
<!-- Mic Toggle -->
<button class="w-[52px] h-[52px] flex items-center justify-center rounded-full bg-surface/20 text-on-primary hover:bg-surface/30 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>
<!-- Video Toggle -->
<button class="w-[52px] h-[52px] flex items-center justify-center rounded-full bg-surface/20 text-on-primary hover:bg-surface/30 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">videocam</span>
</button>
<!-- Chat Toggle -->
<button class="w-[52px] h-[52px] flex items-center justify-center rounded-full bg-surface/20 text-on-primary hover:bg-surface/30 active:scale-95 transition-all relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chat</span>
<!-- Unread badge -->
<span class="absolute top-1 right-1 w-3 h-3 rounded-full bg-primary-container border-2 border-[#5A463F]"></span>
</button>
<!-- End Call -->
<button class="w-[72px] h-[52px] flex items-center justify-center rounded-[26px] bg-error text-on-error hover:bg-error/90 active:scale-95 transition-all shadow-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
