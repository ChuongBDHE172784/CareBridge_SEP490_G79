<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Bỏ qua nhắc nhở</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;501;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#693a2d",
                        "surface-accent-muted": "#F2EAE4",
                        "on-secondary-fixed-variant": "#4a4642",
                        "primary-fixed": "#ffdbd1",
                        "on-surface-variant": "#524440",
                        "tertiary-fixed": "#e6e2dd",
                        "tertiary": "#605e5a",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#ccc5c0",
                        "on-primary-fixed": "#341006",
                        "text-heading": "#2D2A28",
                        "on-tertiary-fixed": "#1d1b19",
                        "inverse-surface": "#32302d",
                        "surface-variant": "#e7e1dd",
                        "on-surface": "#1d1b19",
                        "on-error": "#ffffff",
                        "surface-accent-light": "#F6F1EC",
                        "surface-container": "#f3ede8",
                        "background": "#fef8f4",
                        "tertiary-container": "#9e9a96",
                        "on-tertiary-container": "#34322f",
                        "status-active": "#C98C7B",
                        "surface-container-low": "#f9f2ee",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#484643",
                        "inverse-primary": "#fab7a4",
                        "tertiary-fixed-dim": "#cac6c1",
                        "secondary-container": "#e9e1db",
                        "text-body": "#524F4C",
                        "surface-main": "#FFFFFF",
                        "surface": "#fef8f4",
                        "primary-container": "#c98c7b",
                        "outline-variant": "#d6c2bd",
                        "surface-container-highest": "#e7e1dd",
                        "inverse-on-surface": "#f6f0eb",
                        "surface-tint": "#845143",
                        "surface-container-high": "#ede7e3",
                        "surface-dim": "#dfd9d5",
                        "secondary": "#625d59",
                        "on-secondary-container": "#68635f",
                        "error": "#ba1a1a",
                        "on-primary-container": "#51271b",
                        "on-background": "#1d1b19",
                        "outline": "#84736f",
                        "primary-fixed-dim": "#fab7a4",
                        "on-secondary-fixed": "#1e1b18",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#fef8f4",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#e9e1db",
                        "primary": "#845143",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "panel-gap": "24px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "grid-gutter": "24px",
                        "container-padding": "32px",
                        "sidebar-width": "280px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "nav-item": ["Quicksand"],

                        "body-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "nav-item": ["15px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fef8f4;
            color: #1d1b19;
            -webkit-tap-highlight-color: transparent;
        }
        .clay-card {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 4px 20px rgba(201, 140, 123, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-toast {
            transform: translateY(100px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .success-toast.active {
            transform: translateY(0);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
<!-- Top App Bar (Simplified for task-focused screen) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-4 h-16">
<button class="p-2 hover:opacity-80 active:scale-95 transition-transform" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">CareBridge</h1>
<div class="w-10"></div> <!-- Spacer -->
</header>
<main class="w-full max-w-md mt-20 mb-24 transition-opacity duration-300" id="main-content">
<!-- Reminder Summary Section -->
<div class="clay-card p-6 mb-6">
<div class="flex items-start gap-4 mb-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<div>
<span class="font-label-md text-label-md text-primary tracking-wider uppercase mb-1 block">Sắp diễn ra lúc 08:30</span>
<h2 class="font-headline-sm text-headline-sm text-text-heading">Uống thuốc điều trị cao huyết áp</h2>
<p class="font-body-md text-body-md text-text-body mt-1">Liều lượng: 1 viên (5mg), sau khi ăn sáng.</p>
</div>
</div>
<div class="bg-surface-accent-light rounded-xl p-4 border border-outline-variant/30">
<div class="flex items-center gap-2 text-primary font-body-md font-semibold">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
<span>Chỉ lần này</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 italic">Các lần nhắc nhở tiếp theo trong lịch trình sẽ không thay đổi.</p>
</div>
</div>
<!-- Skip Reason & Preview -->
<div class="clay-card p-6 space-y-6">
<div class="space-y-3">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="skip-reason">Lý do bỏ qua (không bắt buộc)</label>
<textarea class="w-full h-24 px-4 py-3 bg-surface-accent-light border-2 border-surface-accent-muted focus:border-primary-container focus:ring-0 rounded-2xl font-body-md transition-colors placeholder:text-outline/60 resize-none" id="skip-reason" placeholder="Ví dụ: Đã uống sớm hơn, Hết thuốc..."></textarea>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-2xl">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">update</span>
<div>
<p class="font-label-md text-label-md text-secondary uppercase">Lần nhắc kế tiếp</p>
<p class="font-body-lg text-body-lg text-text-heading">Mai, 08:30</p>
</div>
</div>
</div>
</div>
<!-- Call to Action -->
<div class="mt-8 px-2 space-y-3">
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-full font-nav-item text-nav-item shadow-lg active:scale-95 transition-all hover:bg-opacity-90" onclick="confirmSkip()">
                Bỏ qua lần này
            </button>
<button class="w-full py-3 text-secondary font-nav-item text-nav-item hover:bg-surface-container-high rounded-full transition-colors" onclick="window.history.back()">
                Hủy bỏ
            </button>
</div>
</main>
<!-- Success State Toast/Overlay -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-50 pointer-events-none" id="success-state">
<div class="success-toast bg-inverse-surface text-inverse-on-surface p-4 rounded-2xl flex items-center justify-between shadow-2xl">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed">check_circle</span>
<span class="font-body-md">Đã bỏ qua nhắc nhở</span>
</div>
<button class="pointer-events-auto bg-primary text-on-primary px-4 py-2 rounded-full font-label-md hover:bg-primary-fixed-dim transition-colors" onclick="undoSkip()">
                Hoàn tác
            </button>
</div>
</div>
<!-- Atmosphere Background Element -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-primary-fixed opacity-20 blur-[100px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-secondary-fixed opacity-30 blur-[100px] rounded-full"></div>
</div>
<script>
        function confirmSkip() {
            const mainContent = document.getElementById('main-content');
            const successToast = document.querySelector('.success-toast');
            
            // Fade out the main content slightly
            mainContent.classList.add('opacity-40');
            mainContent.style.pointerEvents = 'none';

            // Trigger success toast
            successToast.parentElement.classList.remove('hidden');
            setTimeout(() => {
                successToast.classList.add('active');
            }, 100);

            // Auto-dismiss or move on after a while
            // In a real app, this would route back to the dashboard
        }

        function undoSkip() {
            const mainContent = document.getElementById('main-content');
            const successToast = document.querySelector('.success-toast');

            successToast.classList.remove('active');
            
            setTimeout(() => {
                mainContent.classList.remove('opacity-40');
                mainContent.style.pointerEvents = 'auto';
            }, 300);
        }

        // Initialize Material Symbols Weights
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            if (icon.textContent === 'check_circle' || icon.textContent === 'medical_services') {
                icon.style.fontVariationSettings = "'FILL' 1";
            }
        });
    </script>
</body></html>
