<!DOCTYPE html>

<style>
        .backdrop-blur-ambient {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-entrance {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden flex items-center justify-center">
<!-- Blurred Content Mockup (to provide context) -->
<div class="absolute inset-0 z-0 opacity-20 select-none pointer-events-none filter blur-md">
<header class="flex justify-between items-center px-safe-margin h-touch-target-min w-full bg-background border-b border-surface-variant">
<span class="font-display-lg text-display-lg text-primary">CareBridge</span>
</header>
<main class="p-safe-margin space-y-stack-lg mt-8">
<div class="bg-surface-container rounded-lg h-32 w-full max-w-md mx-auto"></div>
<div class="bg-surface-container-high rounded-lg h-48 w-full max-w-md mx-auto"></div>
</main>
</div>
<!-- Soft Overlay -->
<div class="absolute inset-0 z-40 bg-[#271812]/50 backdrop-blur-ambient flex items-end md:items-center justify-center p-0 md:p-safe-margin">
<!-- Confirmation Bottom Sheet / Modal -->
<div class="bg-surface-bright w-full md:w-[400px] md:rounded-lg rounded-t-lg shadow-xl p-safe-margin pt-10 md:pt-safe-margin animate-entrance flex flex-col items-center relative z-50">
<!-- Mobile Handle -->
<div class="w-12 h-1.5 bg-outline-variant/30 rounded-full absolute top-3 md:hidden"></div>
<!-- Icon/Avatar Section -->
<div class="relative mb-stack-lg">
<div class="w-24 h-24 rounded-full bg-primary-container flex items-center justify-center shadow-lg">
<!-- Brand colored icon placeholder -->
<img alt="Avatar" class="w-full h-full rounded-full object-cover border-4 border-surface-bright" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHOsdxERFX5Gt17_bPLq28OPrbVEvPcLpYcAmc54Xv3POke15ZBMS23HOE-9y18Wr7KlxnThq27_ag2jtbBU4zJ0LKpcGpvmqGtwOQwntKmPj0Yas32bPqHTYbXT1uWaMsYt_UDPcKgN6Cdkm429hepaG9Ns-bIj-QFbyp0IvgxjXtgFd7Bc-4ytObfJV8aZ77nHp5cHG2pzYoCVHAbB9M_VJXR3TrM6oHaHvJK5O6b0P_RYLBbzXl2Ysc8ki-tEK3K0eUaycofFI"/>
<div class="absolute bottom-0 right-0 bg-surface-bright rounded-full p-1 shadow-sm border border-outline-variant/20">
<span class="material-symbols-outlined text-primary" style="font-size: 24px;">logout</span>
</div>
</div>
</div>
<!-- Content -->
<h2 class="font-headline-lg text-headline-lg text-on-surface text-center mb-2">Đăng xuất</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center px-4">
                Bạn có chắc chắn muốn đăng xuất?
            </p>
<p class="font-body-md text-body-md text-primary font-semibold text-center mt-2 mb-stack-lg">
                Tài khoản: Nguyễn Thị Mai
            </p>
<!-- Actions -->
<div class="flex flex-col gap-stack-md w-full mt-2 pb-safe-margin md:pb-0">
<button class="w-full h-[56px] bg-[#C98C7B] text-white font-button text-button rounded-full flex items-center justify-center shadow-md active:scale-[0.98] transition-transform duration-200">
                    Đăng xuất
                </button>
<button class="w-full h-[56px] bg-surface-container-low text-on-surface font-button text-button rounded-full flex items-center justify-center active:scale-[0.98] transition-transform duration-200">
                    Hủy
                </button>
</div>
</div>
</div>
