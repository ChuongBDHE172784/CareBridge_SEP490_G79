<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Tạo tài khoản</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ccc5c0",
                        "inverse-surface": "#3e2c26",
                        "error": "#ba1a1a",
                        "surface-variant": "#fadcd3",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#ffe2d9",
                        "secondary-container": "#f6dacf",
                        "on-tertiary-container": "#36322e",
                        "secondary": "#6e5a52",
                        "primary-container": "#c98c7b",
                        "primary-fixed": "#ffdbd1",
                        "outline-variant": "#d6c2bd",
                        "on-background": "#271812",
                        "secondary-fixed-dim": "#dbc1b7",
                        "on-tertiary": "#ffffff",
                        "outline": "#84736f",
                        "primary-fixed-dim": "#fab7a4",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fff8f6",
                        "on-secondary-fixed-variant": "#55433b",
                        "tertiary-container": "#a09a95",
                        "primary": "#845143",
                        "on-primary-fixed-variant": "#693a2d",
                        "surface-container-low": "#fff1ec",
                        "on-primary-container": "#51271b",
                        "surface-container-highest": "#fadcd3",
                        "surface-dim": "#f1d4ca",
                        "surface": "#fff8f6",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#ffede7",
                        "tertiary-fixed": "#e9e1db",
                        "on-secondary": "#ffffff",
                        "background": "#fff8f6",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#341006",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#1e1b18",
                        "on-surface-variant": "#524440",
                        "on-secondary-container": "#735e56",
                        "on-surface": "#271812",
                        "inverse-primary": "#fab7a4",
                        "on-secondary-fixed": "#271812",
                        "secondary-fixed": "#f8ddd2",
                        "on-tertiary-fixed-variant": "#4a4642",
                        "surface-tint": "#845143",
                        "surface-container": "#ffe9e3",
                        "tertiary": "#625d59"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "touch-target-min": "48px",
                        "safe-margin": "24px",
                        "gutter": "16px",
                        "stack-lg": "24px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Lexend"],
                        "label-md": ["Lexend"],
                        "display-lg": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "headline-lg": ["Lexend"],
                        "body-md": ["Lexend"],
                        "button": ["Lexend"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F6F1EC;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-field:focus-within label {
            color: theme('colors.primary');
        }
        .input-field:focus-within input {
            border-color: theme('colors.primary');
            outline: none;
            box-shadow: 0 0 0 1px theme('colors.primary');
        }
        .error-field input {
            border-color: theme('colors.error');
            box-shadow: 0 0 0 1px theme('colors.error');
        }
        .error-field label {
            color: theme('colors.error');
        }
        
        /* Custom Checkbox */
        .custom-checkbox input:checked + div {
            background-color: theme('colors.primary-container');
            border-color: theme('colors.primary-container');
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-background min-h-screen flex flex-col max-w-[390px] mx-auto relative overflow-x-hidden shadow-2xl">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-safe-margin h-touch-target-min w-full bg-background/90 backdrop-blur-md sticky top-0 z-50">
<button aria-label="Quay lại" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Tạo tài khoản</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-safe-margin pb-safe-margin pt-stack-md flex flex-col gap-stack-lg">
<!-- Welcome Text -->
<div class="space-y-2">
<h2 class="font-headline-lg text-headline-lg text-primary">Chào mừng bạn! 👋</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Bắt đầu hành trình chăm sóc tuyệt vời cùng CareBridge.</p>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-stack-md bg-surface p-6 rounded-[32px] shadow-[0px_4px_20px_rgba(90,70,63,0.06)] border border-surface-container-low">
<!-- Name Input -->
<div class="input-field relative bg-surface-container-lowest rounded-xl border border-outline-variant/50 transition-all duration-200">
<label class="absolute left-4 top-2 font-label-md text-label-md text-on-surface-variant transition-colors" for="fullName">Họ và tên</label>
<input class="w-full pt-7 pb-2 px-4 bg-transparent border-none font-body-lg text-body-lg text-on-surface placeholder-outline-variant focus:ring-0" id="fullName" placeholder="Nguyễn Thùy Linh" type="text"/>
</div>
<!-- Contact Input -->
<div class="input-field relative bg-surface-container-lowest rounded-xl border border-outline-variant/50 transition-all duration-200">
<label class="absolute left-4 top-2 font-label-md text-label-md text-on-surface-variant transition-colors" for="contactInfo">Email hoặc Số điện thoại</label>
<input class="w-full pt-7 pb-2 px-4 bg-transparent border-none font-body-lg text-body-lg text-on-surface placeholder-outline-variant focus:ring-0" id="contactInfo" placeholder="09xx xxx xxx" type="text"/>
</div>
<!-- Role Selector -->
<div class="space-y-2 pt-2 pb-1">
<span class="font-label-md text-label-md text-on-surface-variant px-1">Vai trò của bạn</span>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="role" type="radio" value="mother"/>
<div class="px-4 py-2 rounded-full border border-outline-variant/50 bg-surface-container-lowest text-on-surface-variant font-body-md text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors shadow-sm peer-active:scale-95">
                            Mẹ bầu
                        </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="role" type="radio" value="family"/>
<div class="px-4 py-2 rounded-full border border-outline-variant/50 bg-surface-container-lowest text-on-surface-variant font-body-md text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors shadow-sm peer-active:scale-95">
                            Người thân
                        </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="role" type="radio" value="expert"/>
<div class="px-4 py-2 rounded-full border border-outline-variant/50 bg-surface-container-lowest text-on-surface-variant font-body-md text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors shadow-sm peer-active:scale-95">
                            Chuyên gia
                        </div>
</label>
</div>
</div>
<!-- Password Input -->
<div class="input-field relative bg-surface-container-lowest rounded-xl border border-outline-variant/50 transition-all duration-200">
<label class="absolute left-4 top-2 font-label-md text-label-md text-on-surface-variant transition-colors" for="password">Mật khẩu</label>
<input class="w-full pt-7 pb-2 pl-4 pr-12 bg-transparent border-none font-body-lg text-body-lg text-on-surface placeholder-outline-variant focus:ring-0" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Hiện mật khẩu" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Confirm Password Input (Error State) -->
<div class="error-field relative bg-surface-container-lowest rounded-xl border border-error/50 transition-all duration-200">
<label class="absolute left-4 top-2 font-label-md text-label-md text-error transition-colors" for="confirmPassword">Xác nhận mật khẩu</label>
<input class="w-full pt-7 pb-2 pl-4 pr-12 bg-transparent border-none font-body-lg text-body-lg text-on-surface placeholder-outline-variant focus:ring-0" id="confirmPassword" placeholder="•••••••" type="password" value="Abcd@1234"/>
<div class="absolute right-12 top-1/2 -translate-y-1/2 text-error pointer-events-none">
<span class="material-symbols-outlined text-[20px]">error</span>
</div>
<button aria-label="Hiện mật khẩu" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<p class="text-error font-body-md text-body-md -mt-2 px-1">Mật khẩu không khớp</p>
<!-- Password Checklist -->
<div class="bg-surface-container-low p-4 rounded-xl border border-surface-container-high/50">
<p class="font-label-md text-label-md text-on-surface-variant mb-2">Mật khẩu cần có:</p>
<ul class="space-y-1.5">
<li class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-tertiary">check_circle</span>
<span class="font-body-md text-body-md text-[13px]">Ít nhất 8 ký tự</span>
</li>
<li class="flex items-center gap-2 text-primary-container">
<span class="material-symbols-outlined text-[16px] text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-[13px] font-medium">Chứa ký tự đặc biệt (@, #, $,...)</span>
</li>
</ul>
</div>
<!-- Consent Checkbox -->
<label class="custom-checkbox flex items-start gap-3 cursor-pointer group mt-2">
<input class="sr-only" required="" type="checkbox"/>
<div class="w-5 h-5 mt-0.5 rounded border-2 border-outline-variant flex items-center justify-center transition-colors group-hover:border-primary group-active:scale-90 flex-shrink-0">
<svg class="w-3.5 h-3.5 text-on-primary-container hidden" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-body-md text-body-md text-on-surface-variant leading-tight">
                    Tôi đồng ý với <a class="text-primary font-medium hover:underline" href="#">Điều khoản</a> và <a class="text-primary font-medium hover:underline" href="#">Chính sách quyền riêng tư</a>
</span>
</label>
</form>
</main>
<!-- Footer Actions (Sticky Bottom) -->
<footer class="px-safe-margin pb-[34px] pt-4 bg-background border-t border-surface-container-low/30 sticky bottom-0 z-40">
<button class="w-full h-[52px] bg-primary-container text-on-primary-container rounded-full font-button text-button shadow-[0px_4px_12px_rgba(201,140,123,0.3)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 relative overflow-hidden group" type="button">
<span class="relative z-10 flex items-center gap-2">
                Tạo tài khoản
                <!-- Spinner hidden by default, can be toggled with JS -->
<span class="material-symbols-outlined animate-spin hidden text-[20px]">progress_activity</span>
</span>
<!-- Ripple effect overlay -->
<div class="absolute inset-0 bg-white/20 opacity-0 group-active:opacity-100 transition-opacity"></div>
</button>
<div class="mt-6 text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">
                Đã có tài khoản? <span class="text-primary font-medium">Đăng nhập</span>
</a>
</div>
</footer>
<script>
        // Simple toggle for eye icons
        document.querySelectorAll('button[aria-label="Hiện mật khẩu"], button[aria-label="Ẩn mật khẩu"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('span');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    this.setAttribute('aria-label', 'Ẩn mật khẩu');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    this.setAttribute('aria-label', 'Hiện mật khẩu');
                }
            });
        });
    </script>
</body></html>
