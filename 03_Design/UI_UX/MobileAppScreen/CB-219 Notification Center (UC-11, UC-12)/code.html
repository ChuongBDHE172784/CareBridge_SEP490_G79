<body class="bg-[#F6F1EC] min-h-screen font-body-md text-on-background selection:bg-primary-container/30">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-[#F6F1EC]/90 backdrop-blur-md transition-shadow">
<div class="flex justify-between items-center px-safe-margin h-touch-target-min w-full">
<button aria-label="Quay lại" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">
                Thông báo
            </h1>
<button aria-label="Cài đặt thông báo" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</header>
<main class="pb-safe-margin max-w-[390px] mx-auto md:max-w-2xl">
<!-- Filters -->
<div class="px-safe-margin py-stack-md flex gap-stack-sm overflow-x-auto no-scrollbar scroll-smooth">
<button class="flex items-center justify-center px-6 py-3 rounded-full bg-primary-container text-on-primary font-button text-button whitespace-nowrap transition-transform active:scale-95 shadow-[0px_8px_24px_rgba(90,70,63,0.12)]">
                Tất cả
            </button>
<button class="flex items-center justify-center px-6 py-3 rounded-full bg-surface text-on-surface-variant font-button text-button whitespace-nowrap transition-transform active:scale-95 border border-outline-variant shadow-[0px_4px_20px_rgba(90,70,63,0.06)]">
                Chưa đọc
            </button>
<button class="flex items-center justify-center px-6 py-3 rounded-full bg-surface text-on-surface-variant font-button text-button whitespace-nowrap transition-transform active:scale-95 border border-outline-variant shadow-[0px_4px_20px_rgba(90,70,63,0.06)]">
                Hệ thống
            </button>
</div>
<!-- Notification List -->
<div class="px-safe-margin flex flex-col gap-stack-sm mt-stack-md">
<!-- Notification Item (Unread, System) -->
<button class="w-full text-left bg-surface rounded-[24px] p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] relative overflow-hidden group active:scale-[0.98] transition-all duration-200">
<div class="absolute inset-y-0 left-0 w-1.5 bg-[#C98C7B]"></div>
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">campaign</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="font-headline-md text-headline-md text-on-surface truncate pr-2">Cập nhật hệ thống mới</h3>
<span class="font-label-md text-label-md text-on-surface-variant whitespace-nowrap">2 phút trước</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-2">Chúng tôi vừa cập nhật một số tính năng mới để cải thiện trải nghiệm của bạn. Hãy khám phá ngay!</p>
</div>
</div>
</button>
<!-- Notification Item (Unread, Community) -->
<button class="w-full text-left bg-surface rounded-[24px] p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] relative overflow-hidden group active:scale-[0.98] transition-all duration-200">
<div class="absolute inset-y-0 left-0 w-1.5 bg-[#C98C7B]"></div>
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 border-2 border-surface">
<img alt="Avatar" class="w-full h-full object-cover" data-alt="A detailed 50-100 word prompt describing a warm, inviting portrait of a Vietnamese mother, soft lighting, minimalist background in pale warm tones, matching the CareBridge app organic minimalism aesthetic. High quality, professional photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0Itwx8zrJvNWpLt78dsyM0H1zZAMHIJP2tc8NJyA2te05klOxwk8Jg9oajkSjG1vUL76ujanv58G5FNBcTZD-9hvbuir5qKFcOZlYV7lHqc6xYZWwqhhyqfCuUQbwPzOSaOeHRjUK-9dU95cmgtQZw48U-fraQ_2CnPNJFCfINf-blG3H00nOcpVYSeZa_cryy5p9AIUPYVbfDa840PK7-BODXpHc-UN6ac4SrfecFj-iHKGXZUQoCQqO2ihqZR19bsRzhnoy1uk"/>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="font-headline-md text-headline-md text-on-surface truncate pr-2">Mẹ Bỉm Sữa <span class="font-body-md text-body-md font-normal text-on-surface-variant">đã bình luận về bài viết của bạn</span></h3>
<span class="font-label-md text-label-md text-on-surface-variant whitespace-nowrap">1 giờ trước</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-2">"Cảm ơn chia sẻ rất hữu ích của mẹ! Bé nhà mình cũng đang gặp tình trạng tương tự."</p>
</div>
</div>
</button>
<!-- Notification Item (Read, Reminder) -->
<button class="w-full text-left bg-surface/60 rounded-[24px] p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.04)] relative overflow-hidden group active:scale-[0.98] transition-all duration-200 border border-outline-variant/30">
<div class="flex items-start gap-4 opacity-70">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0 text-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">vaccines</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="font-headline-md text-headline-md text-on-surface truncate pr-2">Nhắc nhở lịch tiêm</h3>
<span class="font-label-md text-label-md text-on-surface-variant whitespace-nowrap">Hôm qua</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-2">Đừng quên lịch tiêm phòng 6 trong 1 cho bé vào ngày mai lúc 9:00 sáng nhé.</p>
</div>
</div>
</button>
<!-- Notification Item (Read, Activity) -->
<button class="w-full text-left bg-surface/60 rounded-[24px] p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.04)] relative overflow-hidden group active:scale-[0.98] transition-all duration-200 border border-outline-variant/30">
<div class="flex items-start gap-4 opacity-70">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0 text-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">star</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="font-headline-md text-headline-md text-on-surface truncate pr-2">Thành tích mới</h3>
<span class="font-label-md text-label-md text-on-surface-variant whitespace-nowrap">2 ngày trước</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-2">Chúc mừng! Bạn đã hoàn thành 7 ngày ghi chép nhật ký liên tục. Tiếp tục phát huy nhé!</p>
</div>
</div>
</button>
</div>
</main>
