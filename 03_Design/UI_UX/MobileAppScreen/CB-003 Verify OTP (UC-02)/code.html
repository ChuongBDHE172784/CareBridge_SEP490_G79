<script>
        // Simple script to auto-advance focus on OTP inputs for prototype feel
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                    inputs[index].classList.remove('border-primary', 'border-2');
                    inputs[index].classList.add('border-outline-variant', 'border');
                    inputs[index + 1].classList.add('border-primary', 'border-2');
                    inputs[index + 1].classList.remove('border-outline-variant', 'border');
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index].classList.remove('border-primary', 'border-2');
                    inputs[index].classList.add('border-outline-variant', 'border');
                    inputs[index - 1].classList.add('border-primary', 'border-2');
                    inputs[index - 1].classList.remove('border-outline-variant', 'border');
                }
            });
            // Focus styling logic
            input.addEventListener('focus', () => {
                input.classList.add('border-primary', 'border-2');
                input.classList.remove('border-outline-variant', 'border');
            });
            input.addEventListener('blur', () => {
                input.classList.remove('border-primary', 'border-2');
                input.classList.add('border-outline-variant', 'border');
            });
        });
    </script>
