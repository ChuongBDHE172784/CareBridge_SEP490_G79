<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Nhắc Lịch Thuốc</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#484643",
                    "inverse-on-surface": "#f6f0eb",
                    "surface-container-high": "#ede7e3",
                    "on-secondary-fixed": "#1e1b18",
                    "primary-fixed-dim": "#fab7a4",
                    "on-primary-fixed": "#341006",
                    "text-body": "#524F4C",
                    "surface-main": "#FFFFFF",
                    "surface-accent-muted": "#F2EAE4",
                    "surface-tint": "#845143",
                    "inverse-surface": "#32302d",
                    "primary-container": "#c98c7b",
                    "background": "#fef8f4",
                    "surface-dim": "#dfd9d5",
                    "text-heading": "#2D2A28",
                    "on-secondary-container": "#68635f",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f9f2ee",
                    "tertiary-fixed-dim": "#cac6c1",
                    "surface-bright": "#fef8f4",
                    "surface-container-highest": "#e7e1dd",
                    "error": "#ba1a1a",
                    "on-background": "#1d1b19",
                    "on-tertiary-container": "#34322f",
                    "on-primary-fixed-variant": "#693a2d",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "surface-accent-light": "#F6F1EC",
                    "secondary": "#625d59",
                    "surface-variant": "#e7e1dd",
                    "secondary-fixed-dim": "#ccc5c0",
                    "secondary-container": "#e9e1db",
                    "primary-fixed": "#ffdbd1",
                    "on-tertiary-fixed": "#1d1b19",
                    "surface": "#fef8f4",
                    "secondary-fixed": "#e9e1db",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#e6e2dd",
                    "tertiary": "#605e5a",
                    "on-surface": "#1d1b19",
                    "status-active": "#C98C7B",
                    "inverse-primary": "#fab7a4",
                    "outline": "#84736f",
                    "tertiary-container": "#9e9a96",
                    "on-primary-container": "#51271b",
                    "on-secondary-fixed-variant": "#4a4642",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#f3ede8",
                    "primary": "#845143",
                    "outline-variant": "#d6c2bd",
                    "on-surface-variant": "#524440",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "panel-gap": "24px",
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "grid-gutter": "24px",
                    "container-padding": "32px",
                    "sidebar-width": "280px",
                    "container-margin-mobile": "16px"
            },
            "fontFamily": {
                    "label-md": ["Quicksand"],
                    "label-caps": ["Quicksand"],
                    "headline-sm": ["Quicksand"],
                    "display-lg": ["Quicksand"],
                    "body-lg": ["Quicksand"],
                    "headline-md": ["Quicksand"],
                    "headline-lg-mobile": ["Quicksand"],
                    "body-md": ["Quicksand"],
                    "nav-item": ["Quicksand"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "label-caps": ["10px", {"lineHeight": "12px", "letterSpacing": "0.08em", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "nav-item": ["15px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fef8f4;
            color: #1d1b19;
            -webkit-tap-highlight-color: transparent;
        }

        /* Claymorphism Utilities */
        .clay-card {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 
                8px 8px 16px rgba(201, 140, 123, 0.15),
                -4px -4px 12px rgba(255, 255, 255, 0.8),
                inset 2px 2px 4px rgba(255, 255, 255, 0.5),
                inset -2px -2px 4px rgba(201, 140, 123, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .clay-button-primary {
            background: #C98C7B;
            color: white;
            border-radius: 9999px;
            box-shadow: 
                4px 4px 10px rgba(132, 81, 67, 0.3),
                inset 4px 4px 8px rgba(255, 255, 255, 0.3),
                inset -4px -4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        .clay-button-primary:active {
            transform: scale(0.96);
            box-shadow: 
                2px 2px 5px rgba(132, 81, 67, 0.3),
                inset 2px 2px 4px rgba(255, 255, 255, 0.2);
        }

        .clay-input {
            background: #fdfaf8;
            border-radius: 1.25rem;
            border: 2px solid #F2EAE4;
            box-shadow: 
                inset 3px 3px 6px rgba(201, 140, 123, 0.05),
                inset -2px -2px 4px rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .clay-input:focus {
            border-color: #C98C7B;
            outline: none;
            background: #ffffff;
        }

        .clay-toggle-bg {
            background: #ede7e3;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
        }

        .clay-toggle-dot {
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        /* Material Icon Alignment */
        .material-symbols-outlined {
            vertical-align: middle;
            line-height: 1;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #C98C7B;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="pb-24">
<!-- Top Navigation Anchor (Shared Component) -->
<header class="fixed top-0 w-full z-50 bg-background flex items-center justify-between px-4 h-16 shadow-[0px_4px_20px_rgba(90,70,63,0.08)]">
<button class="text-primary active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">CareBridge</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="mt-20 px-4 max-w-md mx-auto space-y-6">
<!-- Header Section -->
<section class="text-center py-4">
<div class="inline-flex items-center justify-center p-4 clay-card mb-4 bg-primary-fixed bg-opacity-30">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h2 class="font-headline-md text-text-heading">Tạo nhắc lịch uống</h2>
<p class="font-body-md text-secondary">Giúp bạn và người thân không bao giờ quên lịch</p>
</section>
<!-- Form Section -->
<form class="space-y-5" id="medication-form">
<!-- Drug Name & Type -->
<div class="clay-card p-6 space-y-4">
<div>
<label class="block font-label-md text-primary mb-2 ml-1">Tên thuốc / Vitamin</label>
<input class="w-full clay-input px-4 py-3 font-body-lg" placeholder="Nhập tên thuốc..." required="" type="text"/>
</div>
<div class="flex items-center justify-between bg-surface-accent-light rounded-2xl p-3 border border-dashed border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container">info</span>
<span class="font-label-md text-on-surface-variant">Non-prescription (Tự kê đơn)</span>
</div>
<span class="px-2 py-1 bg-primary text-white text-[10px] font-bold rounded-full uppercase tracking-wider">Rõ ràng</span>
</div>
</div>
<!-- Subject Selection (Bento Style Card) -->
<div class="clay-card p-6">
<label class="block font-label-md text-primary mb-3 ml-1">Đối tượng sử dụng</label>
<div class="grid grid-cols-2 gap-4">
<button class="subject-btn flex flex-col items-center gap-2 p-4 rounded-2xl border-2 border-transparent bg-surface-container transition-all hover:bg-surface-container-high" id="subj-me" onclick="selectSubject('me')" type="button">
<span class="material-symbols-outlined text-3xl">woman</span>
<span class="font-nav-item">Cho Mẹ</span>
</button>
<button class="subject-btn flex flex-col items-center gap-2 p-4 rounded-2xl border-2 border-transparent bg-surface-container transition-all hover:bg-surface-container-high" id="subj-baby" onclick="selectSubject('baby')" type="button">
<span class="material-symbols-outlined text-3xl">child_care</span>
<span class="font-nav-item">Cho Bé</span>
</button>
</div>
</div>
<!-- Scheduling -->
<div class="clay-card p-6 space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary">schedule</span>
<h3 class="font-headline-sm text-text-heading">Lịch trình</h3>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block font-label-md text-on-surface-variant mb-1 ml-1">Ngày bắt đầu</label>
<input class="w-full clay-input px-4 py-2 font-body-md" type="date"/>
</div>
<div>
<label class="block font-label-md text-on-surface-variant mb-1 ml-1">Kết thúc (Tùy chọn)</label>
<input class="w-full clay-input px-4 py-2 font-body-md" type="date"/>
</div>
</div>
<div>
<label class="block font-label-md text-on-surface-variant mb-1 ml-1">Tần suất uống</label>
<select class="w-full clay-input px-4 py-3 font-body-md appearance-none">
<option>Mỗi ngày</option>
<option>Cách ngày</option>
<option>Hàng tuần</option>
<option>Khi cần thiết</option>
</select>
</div>
<div class="pt-2">
<label class="block font-label-md text-on-surface-variant mb-2 ml-1">Giờ nhắc (Thêm tối đa 4 mốc)</label>
<div class="flex flex-wrap gap-2">
<div class="flex items-center gap-2 bg-surface-accent-muted px-4 py-2 rounded-full border border-primary-container border-opacity-30">
<span class="font-nav-item text-primary">08:00</span>
<button class="material-symbols-outlined text-sm text-outline" type="button">close</button>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white border-2 border-dashed border-outline-variant text-primary active:bg-primary-fixed" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Notes & Notification -->
<div class="clay-card p-6 space-y-4">
<div>
<label class="block font-label-md text-primary mb-2 ml-1">Ghi chú hướng dẫn</label>
<div class="relative">
<textarea class="w-full clay-input px-4 py-3 font-body-md resize-none" placeholder="Lưu ý khi dùng..." rows="2">Theo hướng dẫn đã có</textarea>
<div class="absolute right-3 bottom-3 text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_note</span>
</div>
</div>
</div>
<div class="flex items-center justify-between p-3 bg-surface-container-low rounded-2xl">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">notifications_active</span>
<span class="font-body-md font-semibold">Bật thông báo nhắc nhở</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-12 h-6 clay-toggle-bg peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container clay-toggle-dot"></div>
</label>
</div>
</div>
<!-- Action Button -->
<div class="pt-4 pb-8">
<button class="w-full py-4 clay-button-primary font-headline-sm flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">check_circle</span>
                    Lưu lịch nhắc
                </button>
</div>
</form>
</main>
<!-- Bottom Navigation Shell (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full bg-surface flex justify-around items-center py-3 px-4 z-50 rounded-t-lg shadow-[0px_-4px_20px_rgba(90,70,63,0.08)]">
<div class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low transition-colors rounded-xl px-2 py-1">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps">Trang chủ</span>
</div>
<div class="flex flex-col items-center justify-center text-primary font-bold active:scale-90 transition-transform duration-150 px-2 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">monitor_heart</span>
<span class="font-label-caps text-label-caps">Sức khỏe</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low transition-colors rounded-xl px-2 py-1">
<span class="material-symbols-outlined">notifications</span>
<span class="font-label-caps text-label-caps">Thông báo</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low transition-colors rounded-xl px-2 py-1">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps">Cá nhân</span>
</div>
</nav>
<script>
        function selectSubject(type) {
            const btns = document.querySelectorAll('.subject-btn');
            btns.forEach(btn => {
                btn.classList.remove('bg-primary-container', 'text-white', 'border-primary');
                btn.classList.add('bg-surface-container', 'text-on-surface-variant');
            });

            const activeBtn = document.getElementById('subj-' + type);
            activeBtn.classList.add('bg-primary-container', 'text-white', 'border-primary');
            activeBtn.classList.remove('bg-surface-container', 'text-on-surface-variant');
        }

        // Default selection
        selectSubject('me');

        // Form submission micro-interaction
        document.getElementById('medication-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Đang lưu...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">done_all</span> Thành công!';
                btn.classList.replace('bg-primary-container', 'bg-status-active');
                
                // Reset form visual after 2 seconds
                setTimeout(() => {
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Lưu lịch nhắc';
                    btn.classList.remove('bg-status-active');
                }, 2000);
            }, 1200);
        });
    </script>
</body></html>
