<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Set Consultation Price</title>

        tailwind.config = {

          theme: {

                      "on-background": "#271812",
                      "on-error-container": "#93000a",
                      "surface-container": "#ffe9e3",
                      "primary": "#845143",
                      "surface-container-highest": "#fadcd3",
                      "outline-variant": "#d6c2bd",
                      "error": "#ba1a1a",
                      "surface-bright": "#fff8f6",
                      "secondary-fixed-dim": "#dbc1b7",
                      "on-error": "#ffffff",
                      "surface-variant": "#fadcd3",
                      "secondary": "#6e5a52",
                      "on-primary": "#ffffff",
                      "tertiary-container": "#a09a95",
                      "outline": "#84736f",
                      "on-secondary-container": "#735e56",
                      "surface-container-low": "#fff1ec",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed-dim": "#ccc5c0",
                      "on-secondary-fixed-variant": "#55433b",
                      "on-primary-container": "#51271b",
                      "primary-container": "#c98c7b",
                      "surface-tint": "#845143",
                      "inverse-surface": "#3e2c26",
                      "background": "#fff8f6",
                      "inverse-primary": "#fab7a4",
                      "surface-dim": "#f1d4ca",
                      "on-tertiary-fixed": "#1e1b18",
                      "inverse-on-surface": "#ffede7",
                      "secondary-container": "#f6dacf",
                      "primary-fixed": "#ffdbd1",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed-variant": "#4a4642",
                      "surface": "#fff8f6",
                      "secondary-fixed": "#f8ddd2",
                      "tertiary-fixed": "#e9e1db",
                      "tertiary": "#625d59",
                      "on-surface": "#271812",
                      "on-secondary": "#ffffff",
                      "surface-container-high": "#ffe2d9",
                      "on-secondary-fixed": "#271812",
                      "primary-fixed-dim": "#fab7a4",
                      "on-primary-fixed": "#341006"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-margin-desktop": "40px",
                      "gutter-mobile": "16px",
                      "container-margin-mobile": "20px",
                      "gutter-desktop": "24px",
                      "unit": "8px",
                      "sidebar-width": "280px"
              },
              "fontFamily": {

            }
          }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Soft Ambient Shadow for depth */
        .ambient-shadow {
            box-shadow: 0 4px 20px rgba(90, 70, 63, 0.08);
        }
        
        .ambient-shadow-hover:active {
             box-shadow: 0 8px 24px rgba(90, 70, 63, 0.15);
             transform: translateY(-1px);
        }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #845143;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #845143;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex justify-center">
<!-- Mobile Device Container (390x844 max width constraint) -->
<div class="w-full max-w-[390px] h-screen max-h-[844px] bg-background relative overflow-hidden flex flex-col shadow-2xl sm:border border-outline-variant/30">
<!-- Header / Top App Bar -->
<header class="flex items-center justify-between px-container-margin-mobile h-20 bg-surface z-40 sticky top-0 ambient-shadow shrink-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-text-body hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Set Price</h1>
<div class="w-10 h-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-container-margin-mobile py-6 flex flex-col gap-gutter-mobile">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-2">Configure the pricing parameters for your upcoming consultations. Values must be within the approved organizational bands.</p>
<!-- Form Card -->
<div class="bg-surface rounded-DEFAULT p-4 ambient-shadow flex flex-col gap-6">
<!-- Channel Dropdown -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="channel">Consultation Channel</label>
<div class="relative">
<select class="w-full h-12 appearance-none bg-surface-container-lowest border-2 border-outline-variant rounded-DEFAULT pl-4 pr-10 text-on-surface focus:outline-none focus:border-primary transition-colors cursor-pointer" id="channel">
<option disabled="" selected="" value="">Select channel...</option>
<option value="video">Video Call</option>
<option value="audio">Audio Call</option>
<option value="chat">In-App Chat</option>
<option value="in_person">In-Person Clinic</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Duration Dropdown -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="duration">Duration</label>
<div class="relative">
<select class="w-full h-12 appearance-none bg-surface-container-lowest border-2 border-outline-variant rounded-DEFAULT pl-4 pr-10 text-on-surface focus:outline-none focus:border-primary transition-colors cursor-pointer" id="duration">
<option disabled="" selected="" value="">Select duration...</option>
<option value="15">15 Minutes</option>
<option value="30">30 Minutes</option>
<option value="45">45 Minutes</option>
<option value="60">60 Minutes</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-on-surface-variant">schedule</span>
</div>
</div>
<!-- Price Input with Validation Info -->
<div class="relative">
<div class="flex justify-between items-baseline mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="price">Price Value</label>
<span class="font-body-sm text-[11px] text-tertiary">Band: 200k - 1M IDR</span>
</div>
<div class="relative flex items-center">
<span class="absolute left-4 text-on-surface-variant font-body-lg">Rp</span>
<input class="w-full h-12 bg-surface-container-lowest border-2 border-outline-variant rounded-DEFAULT pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary transition-colors" id="price" max="1000000" min="200000" placeholder="0" type="number"/>
</div>
<p class="font-body-sm text-[12px] text-error mt-1 hidden" id="price-error">Price must be between 200,000 and 1,000,000.</p>
</div>
<!-- Effective Date Picker -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="effective-date">Effective Date</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-lowest border-2 border-outline-variant rounded-DEFAULT pl-4 pr-10 text-on-surface focus:outline-none focus:border-primary transition-colors" id="effective-date" type="date"/>
<span class="material-symbols-outlined absolute right-3 pointer-events-none text-on-surface-variant">calendar_month</span>
</div>
</div>
<!-- Active Status Toggle -->
<div class="flex items-center justify-between pt-2 border-t border-surface-variant">
<div>
<span class="block font-body-lg text-on-surface font-semibold">Active Status</span>
<span class="block font-body-sm text-on-surface-variant text-[13px]">Enable this pricing immediately</span>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-outline-variant/30 top-0 bottom-0 m-auto z-10 transition-transform duration-300 ease-in-out" id="active-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary cursor-pointer transition-colors duration-300 ease-in-out" for="active-toggle"></label>
</div>
</div>
</div>
<!-- Spacer for bottom padding to ensure content isn't hidden behind the fixed CTA -->
<div class="h-24"></div>
</main>
<!-- Fixed Bottom CTA -->
<div class="absolute bottom-0 w-full bg-surface/90 backdrop-blur-md px-container-margin-mobile py-4 border-t border-surface-variant z-50">
<button class="w-full h-12 bg-primary-container text-on-primary font-headline-md text-headline-md rounded-DEFAULT flex items-center justify-center gap-2 ambient-shadow ambient-shadow-hover transition-all duration-200">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
                Save Pricing
            </button>
</div>
</div>
<script>
        // Simple client-side validation logic for visual feedback
        const priceInput = document.getElementById('price');
        const priceError = document.getElementById('price-error');

        priceInput.addEventListener('input', function() {
            const val = parseInt(this.value);
            if (this.value !== "" && (val < 200000 || val > 1000000)) {
                this.classList.add('border-error');
                this.classList.remove('border-primary', 'border-outline-variant');
                priceError.classList.remove('hidden');
            } else {
                this.classList.remove('border-error');
                this.classList.add('border-primary'); // keep it primary while focused/typing
                priceError.classList.add('hidden');
            }
        });

        priceInput.addEventListener('blur', function() {
             const val = parseInt(this.value);
             if (this.value === "" || (val >= 200000 && val <= 1000000)) {
                 this.classList.remove('border-primary');
                 this.classList.add('border-outline-variant');
             }
        });
    </script>
</body></html>
