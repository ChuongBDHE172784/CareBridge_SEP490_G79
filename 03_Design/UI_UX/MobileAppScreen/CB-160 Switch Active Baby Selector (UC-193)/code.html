<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col antialiased">
<!-- Background Content to simulate depth -->
<div class="flex-1 flex flex-col blur-sm opacity-50 transition-all duration-300 pointer-events-none">
<header class="bg-background dark:bg-background text-primary dark:text-inverse-primary font-headline-md text-headline-md full-width top-0 bg-background dark:bg-background flex justify-between items-center px-gutter-mobile h-16 w-full z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-inverse-primary">Ứng dụng Mẹ và Bé</h1>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">close</span>
</div>
</header>
<main class="flex-1 px-container-margin-mobile py-4 space-y-4">
<div class="h-32 bg-surface-container rounded-lg shadow-[0_-4px_20px_rgba(90,70,63,0.08)]"></div>
<div class="h-48 bg-surface-container rounded-lg shadow-[0_-4px_20px_rgba(90,70,63,0.08)]"></div>
<div class="h-24 bg-surface-container rounded-lg shadow-[0_-4px_20px_rgba(90,70,63,0.08)]"></div>
</main>
</div>
<!-- Scrim / Overlay -->
<div class="absolute inset-0 bg-black/40 z-40 transition-opacity"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 w-full bg-surface rounded-t-[32px] z-50 shadow-[0_-4px_20px_rgba(90,70,63,0.15)] flex flex-col transform transition-transform duration-300">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-4">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-container-margin-mobile pb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6 text-center">Chọn Hồ Sơ Bé</h2>
<!-- Profiles List -->
<div class="space-y-4 mb-8">
<!-- Active Profile -->
<div class="group flex items-center p-4 bg-primary-container/10 border-2 border-primary-container rounded-xl shadow-[0_-4px_20px_rgba(90,70,63,0.05)] cursor-pointer transition-all active:scale-[0.98]">
<div class="relative">
<img class="w-14 h-14 rounded-full object-cover border-2 border-primary-container" data-alt="A soft, warm-toned illustration of a cute baby girl with a pink bow, designed in a flat, clean minimalist style suitable for a medical or parenting app avatar. The colors are soothing and soft, featuring muted pinks and gentle terracottas against a clean background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuByG1PIT2hjJkDI60BcDPiBVsUedxF6rfgOMDfKibJh05aDIGZaDfEvRXCAEqLoRanZ36YIdL00O7i2WBG4pYOO62HiiUM8s2in-ZKYwAjkp-aad4lPtdfFQDJ3IgT3hVs85dwqHT2ZwG0s5LfoE6ZR7zHfXpZRcEgIe4A41r8ub2pAVdh_1XJOqi22vETjqUIcgB4BLRt_VgDKOmVcPolQp74QJcx8aQYqHOt1p3PUxQozu7DX1-2kIHjQ-LltWwPiD6I5Ks1R2Ws"/>
<div class="absolute bottom-0 right-0 w-4 h-4 bg-[#4ade80] border-2 border-surface rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[10px] text-on-primary font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="ml-4 flex-1">
<div class="flex justify-between items-start">
<h3 class="font-body-lg text-body-lg font-bold text-on-surface">Bé Na</h3>
<span class="font-label-caps text-label-caps bg-primary-container text-on-primary-container px-2 py-0.5 rounded-full">Đang chọn</span>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-0.5">8 tháng tuổi</p>
<p class="font-body-sm text-body-sm text-outline text-xs mt-1">Cập nhật: 2 giờ trước</p>
</div>
</div>
<!-- Inactive Profile -->
<div class="group flex items-center p-4 bg-surface-container-low border border-surface-container-highest rounded-xl shadow-[0_-4px_20px_rgba(90,70,63,0.05)] cursor-pointer hover:bg-surface-container transition-all active:scale-[0.98]">
<div class="relative">
<img class="w-14 h-14 rounded-full object-cover border-2 border-transparent" data-alt="A gentle, warm-toned illustration of a cute baby boy with a small tuft of hair, designed in a clean, minimalist flat style suitable for a parenting app avatar. Soft pastel blues and warm earthy tones dominate, creating a calming, safe aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3BRAGm19vHaUDVK3XcDB1GcHgwifGa2dRbU2dRNnnd2WQBCqAziodsllgZzEWPhUWO_cFgUK8-eQBkHPFcKTLg0TajXT1AtcuQM1b5NpEqXoDty7-SdFUxehyVkb0f56FIKDPU1PmB_q02ZvP9YE5OmvL4WaAyLJeUmYQe_T4ofcJn_GmERyGHVjd6xLxIPh5pT3FR5mdGSIkQ7eSJmvQFvvKKHrEj1Rd0VUZmbX_iXHUHUtlTlluw1jtsP5CLmDq53V2xjHw4Ng"/>
</div>
<div class="ml-4 flex-1">
<div class="flex justify-between items-start">
<h3 class="font-body-lg text-body-lg font-bold text-on-surface">Bé Bo</h3>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-0.5">2 tuổi 3 tháng</p>
<p class="font-body-sm text-body-sm text-outline text-xs mt-1">Cập nhật: 2 ngày trước</p>
</div>
</div>
<!-- Add New Profile Action -->
<div class="group flex items-center p-4 bg-transparent border border-dashed border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low transition-all active:scale-[0.98]">
<div class="w-14 h-14 rounded-full bg-surface-variant flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
</div>
<div class="ml-4 flex-1">
<h3 class="font-body-lg text-body-lg font-bold text-primary">Thêm hồ sơ bé mới</h3>
</div>
</div>
</div>
<!-- Manage Action -->
<button class="w-full h-12 bg-transparent border-2 border-primary-container text-primary-container rounded-full font-headline-md text-headline-md flex items-center justify-center gap-2 hover:bg-primary-container/10 transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">manage_accounts</span>
                Quản lý hồ sơ
            </button>
</div>
</div>
