<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Mobile Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ccc5c0",
                        "inverse-surface": "#3e2c26",
                        "error": "#ba1a1a",
                        "surface-variant": "#fadcd3",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#ffe2d9",
                        "secondary-container": "#f6dacf",
                        "on-tertiary-container": "#36322e",
                        "secondary": "#6e5a52",
                        "primary-container": "#c98c7b",
                        "primary-fixed": "#ffdbd1",
                        "outline-variant": "#d6c2bd",
                        "on-background": "#271812",
                        "secondary-fixed-dim": "#dbc1b7",
                        "on-tertiary": "#ffffff",
                        "outline": "#84736f",
                        "primary-fixed-dim": "#fab7a4",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fff8f6",
                        "on-secondary-fixed-variant": "#55433b",
                        "tertiary-container": "#a09a95",
                        "primary": "#845143",
                        "on-primary-fixed-variant": "#693a2d",
                        "surface-container-low": "#fff1ec",
                        "on-primary-container": "#51271b",
                        "surface-container-highest": "#fadcd3",
                        "surface-dim": "#f1d4ca",
                        "surface": "#fff8f6",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#ffede7",
                        "tertiary-fixed": "#e9e1db",
                        "on-secondary": "#ffffff",
                        "background": "#fff8f6",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#341006",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#1e1b18",
                        "on-surface-variant": "#524440",
                        "on-secondary-container": "#735e56",
                        "on-surface": "#271812",
                        "inverse-primary": "#fab7a4",
                        "on-secondary-fixed": "#271812",
                        "secondary-fixed": "#f8ddd2",
                        "on-tertiary-fixed-variant": "#4a4642",
                        "surface-tint": "#845143",
                        "surface-container": "#ffe9e3",
                        "tertiary": "#625d59",
                        "brand-bg": "#F6F1EC",
                        "brand-text": "#5A463F"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "touch-target-min": "48px",
                        "safe-margin": "24px",
                        "gutter": "16px",
                        "stack-lg": "24px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Lexend"],
                        "label-md": ["Lexend"],
                        "display-lg": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "headline-lg": ["Lexend"],
                        "body-md": ["Lexend"],
                        "button": ["Lexend"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }]
                    }
                }
            }
        }

<style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #F6F1EC;
            color: #5A463F;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .mobile-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            background-color: #F6F1EC;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(90, 70, 63, 0.1);
        }

        @media (min-width: 391px) {
            .mobile-container {
                border-radius: 2rem;
                height: 844px;
            }
        }

        .ambient-glow {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 50% 30%, rgba(255,248,246,0.8) 0%, rgba(246,241,236,0) 60%);
            pointer-events: none;
            z-index: 0;
        }

        .btn-primary {
            background-color: #C98C7B;
            color: #FFFFFF;
            transition: all 0.2s ease;
            box-shadow: 0px 8px 24px rgba(90, 70, 63, 0.12);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0px 4px 12px rgba(90, 70, 63, 0.12);
        }

        .btn-secondary {
            background-color: transparent;
            border: 2px solid #C98C7B;
            color: #5A463F;
            transition: all 0.2s ease;
        }
        
        .btn-secondary:active {
            transform: scale(0.98);
            background-color: rgba(201, 140, 123, 0.05);
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="mobile-container">
<div class="ambient-glow"></div>
<!-- Top Area -->
<div class="flex-1 flex flex-col justify-end px-safe-margin pb-12 z-10 fade-in-up" style="animation-delay: 0.1s;">
<h1 class="font-display-lg text-display-lg text-[#5A463F] mb-stack-sm tracking-tight">CareBridge</h1>
<p class="font-body-lg text-body-lg text-[#5A463F] opacity-80 max-w-[280px]">Đồng hành cùng mẹ trong hành trình làm mẹ tuyệt vời.</p>
</div>
<!-- Actions -->
<div class="px-safe-margin flex flex-col gap-stack-md pb-stack-lg z-10 fade-in-up" style="animation-delay: 0.2s;">
<button class="btn-primary w-full h-[52px] rounded-full font-button text-button flex items-center justify-center">
            Tạo tài khoản
        </button>
<button class="btn-secondary w-full h-[52px] rounded-full font-button text-button flex items-center justify-center">
            Đăng nhập
        </button>
</div>
<!-- Footer -->
<div class="px-safe-margin pb-safe-margin pt-stack-sm z-10 fade-in-up" style="animation-delay: 0.3s;">
<div class="flex justify-center gap-gutter mb-stack-md">
<a class="font-label-md text-label-md text-[#5A463F] opacity-70 hover:opacity-100 transition-opacity" href="#">Điều khoản</a>
<span class="text-[#5A463F] opacity-40">•</span>
<a class="font-label-md text-label-md text-[#5A463F] opacity-70 hover:opacity-100 transition-opacity" href="#">Quyền riêng tư</a>
</div>
<p class="font-label-md text-[11px] leading-4 text-center text-[#5A463F] opacity-50 px-4">
            Ứng dụng cung cấp thông tin tham khảo, không thay thế tư vấn y tế chuyên nghiệp.
        </p>
</div>
</div>
</body></html>
