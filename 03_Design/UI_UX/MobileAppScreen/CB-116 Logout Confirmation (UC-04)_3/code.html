<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Xác nhận đăng xuất</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error-container": "#93000a",
                      "on-secondary-container": "#735e56",
                      "on-primary-fixed": "#341006",
                      "error": "#ba1a1a",
                      "surface-bright": "#fff8f6",
                      "tertiary-fixed": "#e9e1db",
                      "tertiary-container": "#a09a95",
                      "on-surface": "#271812",
                      "secondary-container": "#f6dacf",
                      "on-error": "#ffffff",
                      "secondary-fixed-dim": "#dbc1b7",
                      "secondary-fixed": "#f8ddd2",
                      "surface-dim": "#f1d4ca",
                      "on-secondary-fixed-variant": "#55433b",
                      "secondary": "#6e5a52",
                      "primary-container": "#c98c7b",
                      "surface-container": "#ffe9e3",
                      "surface": "#fff8f6",
                      "on-tertiary-container": "#36322e",
                      "error-container": "#ffdad6",
                      "primary": "#845143",
                      "inverse-surface": "#3e2c26",
                      "on-secondary-fixed": "#271812",
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed-variant": "#4a4642",
                      "tertiary": "#625d59",
                      "outline-variant": "#d6c2bd",
                      "on-surface-variant": "#524440",
                      "on-primary": "#ffffff",
                      "surface-container-low": "#fff1ec",
                      "surface-tint": "#845143",
                      "outline": "#84736f",
                      "background": "#fff8f6",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#fadcd3",
                      "surface-variant": "#fadcd3",
                      "surface-container-high": "#ffe2d9",
                      "on-background": "#271812",
                      "tertiary-fixed-dim": "#ccc5c0",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#693a2d",
                      "inverse-primary": "#fab7a4",
                      "inverse-on-surface": "#ffede7",
                      "on-primary-container": "#51271b",
                      "primary-fixed": "#ffdbd1",
                      "primary-fixed-dim": "#fab7a4",
                      "on-tertiary-fixed": "#1e1b18"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "safe-margin": "24px",
                      "stack-sm": "8px",
                      "touch-target-min": "48px",
                      "stack-lg": "24px",
                      "stack-md": "16px"
              },
              "fontFamily": {
                      "body-lg": ["Lexend"],
                      "headline-lg": ["Lexend"],
                      "display-lg": ["Lexend"],
                      "body-md": ["Lexend"],
                      "headline-md": ["Lexend"],
                      "label-md": ["Lexend"],
                      "button": ["Lexend"]
              },
              "fontSize": {
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "button": ["16px", {"lineHeight": "20px", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-bottom-sheet {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden flex items-end justify-center">
<!-- Dimmed Background Overlay -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-10"></div>
<!-- UI Background Mockup (to show context behind the modal) -->
<div class="absolute inset-0 z-0 opacity-40 select-none pointer-events-none p-safe-margin">
<div class="flex flex-col gap-6 max-w-md mx-auto">
<div class="h-12 w-32 bg-primary/20 rounded-full"></div>
<div class="h-40 bg-surface-container rounded-lg"></div>
<div class="space-y-3">
<div class="h-4 w-3/4 bg-on-surface-variant/20 rounded"></div>
<div class="h-4 w-1/2 bg-on-surface-variant/20 rounded"></div>
</div>
<div class="h-64 bg-surface-container-high rounded-lg"></div>
</div>
</div>
<!-- Confirmation Bottom Sheet -->
<div class="relative z-20 w-full max-w-md bg-surface-bright rounded-t-[32px] shadow-2xl p-safe-margin pb-12 animate-bottom-sheet flex flex-col items-center">
<!-- Bottom Sheet Handle -->
<div class="w-12 h-1 bg-outline-variant/60 rounded-full mb-8 mt-1"></div>
<!-- Logout Icon Section -->
<div class="mb-stack-lg relative">
<div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center">
<div class="w-20 h-20 rounded-full bg-primary/20 flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-white text-3xl">logout</span>
</div>
</div>
</div>
<!-- Smaller overlap icon for extra flair -->
<div class="absolute bottom-0 right-0 bg-surface-bright rounded-full p-1.5 shadow-md border border-outline-variant/20">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">exit_to_app</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-2 mb-stack-lg w-full">
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold">Đăng xuất</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Bạn có chắc chắn muốn đăng xuất?</p>
<div class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-full mt-3">
<span class="material-symbols-outlined text-[20px] text-primary">account_circle</span>
<span class="font-body-md text-on-surface-variant">Tài khoản: <span class="font-semibold text-primary">Nguyễn Thị Mai</span></span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-4">
<!-- Primary Logout Button -->
<button class="w-full h-14 bg-primary-container hover:bg-[#b87c6b] text-white font-button text-button rounded-full shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center">
                Đăng xuất
            </button>
<!-- Secondary Cancel Button -->
<button class="w-full h-14 bg-surface-container-low hover:bg-surface-container-high text-on-surface font-button text-button rounded-full border border-outline-variant/30 active:scale-[0.98] transition-all duration-200 flex items-center justify-center">
                Hủy
            </button>
</div>
</div>
</body></html>
