<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #F6F1EC;
            color: #271812;
            -webkit-tap-highlight-color: transparent;
        }

        .clay-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 
                8px 8px 16px rgba(90, 70, 63, 0.08),
                -8px -8px 16px rgba(255, 255, 255, 0.8),
                inset 1px 1px 2px rgba(255, 255, 255, 0.3);
        }

        .clay-input {
            background: #fff8f6;
            box-shadow: 
                inset 4px 4px 8px rgba(90, 70, 63, 0.05),
                inset -4px -4px 8px rgba(255, 255, 255, 0.9);
            border: 1.5px solid transparent;
            transition: all 0.3s ease;
        }

        .clay-input:focus {
            border-color: #c98c7b;
            outline: none;
            box-shadow: 
                inset 2px 2px 4px rgba(90, 70, 63, 0.03),
                0 0 0 4px rgba(201, 140, 123, 0.1);
        }

        .clay-button-primary {
            background: #c98c7b;
            box-shadow: 
                0 10px 20px rgba(201, 140, 123, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s active;
        }

        .clay-button-primary:active {
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(201, 140, 123, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="flex justify-center min-h-screen">
<!-- Mobile Container (390x844) -->
<main class="w-full max-w-[390px] min-h-screen bg-[#F6F1EC] flex flex-col relative overflow-hidden pb-10">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-[#F6F1EC]/80 backdrop-blur-md flex items-center justify-between px-gutter-mobile h-16">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Chỉnh sửa phản hồi</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Content Canvas -->
<div class="mt-20 px-container-margin-mobile space-y-6">
<!-- Question Context Card -->
<section class="clay-card p-6 flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[18px]">help_center</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">CÂU HỎI CỘNG ĐỒNG</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-background leading-snug">
                    Bé nhà mình 6 tháng tuổi, có nên bắt đầu cho ăn dặm không?
                </h2>
<div class="flex items-center justify-between mt-2 pt-3 border-t border-outline-variant/30">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A warm, soft-focus profile portrait of a young Vietnamese mother smiling gently, lit by natural morning light in a clean minimalist living room. The aesthetic is nurturing, professional, and follows a light-mode color palette with soft peach and taupe tones, embodying a safe and supportive community atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCedBwgc_Gs3ddRRCIER0hu3UEAaPbuY3OXuIipnGkAWvsHba8lhpG3r3R1iFZqgdCTlxIq3D5nFKIwibjmTOq2lJBOOvF8QOmPlu5CJJTfGj4N3tqwoVVuEefGcWgG-AR4frEg6qK8eNXbIOWcGVd5Yzliwvkqb1e5-YsDhNE1rL-6hVdqcJ4ZOpOV1g8DFUnOdAg1iiIxSKIFFdvLLSUAQu9_HbLTmHXeKkbqnefys9ERS8vDudjbqYULLRJLUIKx1Glnxk3j5hM"/>
</div>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-background font-semibold">Mẹ Gấu</span>
<span class="font-label-caps text-[10px] text-secondary">2 giờ trước</span>
</div>
</div>
</div>
</section>
<!-- Moderation Status -->
<div class="flex">
<div class="flex items-center gap-2 px-4 py-2 bg-green-50 border border-green-100 rounded-full">
<span class="material-symbols-outlined text-green-600 text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-sm text-body-sm text-green-700">Trạng thái: Có thể chỉnh sửa</span>
</div>
</div>
<!-- Edit Field -->
<section class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="answer-input">NỘI DUNG PHẢN HỒI CỦA BẠN</label>
<div class="relative group">
<textarea class="clay-input w-full p-5 font-body-lg text-body-lg text-[#5A463F] rounded-[16px] resize-none" id="answer-input" placeholder="Nhập phản hồi của bạn..." rows="8">Theo kinh nghiệm của mình thì 6 tháng là thời điểm rất tốt. Bạn nên bắt đầu bằng bột loãng hoặc rau củ nghiền. Hãy quan sát biểu hiện của bé như bé đã ngồi vững chưa, có hay tóp tép miệng khi thấy người lớn ăn không nhé!</textarea>
<!-- Decorative inner glow/clay effect border -->
<div class="absolute inset-0 rounded-[16px] pointer-events-none border border-white/40"></div>
</div>
<!-- Validation / Helper -->
<div class="flex items-start gap-2 px-1">
<span class="material-symbols-outlined text-outline text-[16px] mt-0.5">info</span>
<p class="font-body-sm text-body-sm text-outline leading-tight">
                        Nội dung phản hồi cần tối thiểu 10 ký tự và tuân thủ quy tắc cộng đồng.
                    </p>
</div>
</section>
<!-- Sticky Actions (pushed by layout rhythm) -->
<footer class="flex flex-col gap-3 pt-4">
<button class="clay-button-primary w-full h-[48px] rounded-full flex items-center justify-center gap-2 text-white font-bold font-body-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">save</span>
                    Lưu thay đổi
                </button>
<button class="w-full h-[48px] rounded-full flex items-center justify-center text-secondary font-semibold font-body-lg hover:bg-surface-container-low active:bg-surface-container transition-colors">
                    Hủy bỏ
                </button>
</footer>
</div>
<!-- Atmospheric Background Element -->
<div class="absolute -bottom-20 -right-20 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl -z-10"></div>
<div class="absolute top-40 -left-20 w-48 h-48 bg-secondary-container/20 rounded-full blur-3xl -z-10"></div>
</main>
<script>
        // Micro-interactions for the textarea and validation
        const textarea = document.getElementById('answer-input');
        
        textarea.addEventListener('input', (e) => {
            const length = e.target.value.trim().length;
            const helperText = document.querySelector('p.font-body-sm');
            const saveBtn = document.querySelector('.clay-button-primary');
            
            if (length < 10) {
                helperText.classList.add('text-error');
                helperText.classList.remove('text-outline');
                saveBtn.style.opacity = '0.5';
                saveBtn.style.pointerEvents = 'none';
            } else {
                helperText.classList.remove('text-error');
                helperText.classList.add('text-outline');
                saveBtn.style.opacity = '1';
                saveBtn.style.pointerEvents = 'auto';
            }
        });

        // Simple haptic feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
