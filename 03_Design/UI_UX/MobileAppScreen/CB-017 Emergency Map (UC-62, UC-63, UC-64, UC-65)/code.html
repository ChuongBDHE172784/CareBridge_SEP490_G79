<div class="bg-error text-on-error rounded-full p-2 shadow-[0px_8px_24px_rgba(90,70,63,0.12)]">

</div>

</div>
<div class="absolute top-1/2 left-2/3 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer opacity-70">
<div class="bg-surface text-primary rounded-full p-2 shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-[20px]">medical_services</span>
</div>
</div>
<!-- User Location Marker -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center">
<div class="w-12 h-12 bg-primary/20 rounded-full animate-pulse absolute"></div>
<div class="w-4 h-4 bg-primary rounded-full border-2 border-surface relative z-10"></div>
</div>
</div>

<span class="material-symbols-outlined text-[16px]">location_on</span>
