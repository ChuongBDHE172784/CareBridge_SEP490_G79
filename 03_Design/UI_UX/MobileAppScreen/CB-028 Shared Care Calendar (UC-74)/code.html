<!DOCTYPE html>

    body {

<body class="bg-background text-on-background min-h-screen pb-24 font-body-md">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background docked full-width top-0 flat no shadows flex justify-between items-center px-safe-margin h-touch-target-min w-full sticky z-40">
<div class="flex items-center gap-stack-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">person</span>
</div>
<span class="font-display-lg text-display-lg text-primary dark:text-primary-fixed-dim">CareBridge</span>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="px-safe-margin pt-stack-md flex flex-col gap-stack-lg">
<!-- Calendar Header Area -->
<section class="flex justify-between items-end">
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Tháng 10, 2023</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Lịch chăm sóc chung</p>
</div>
<button class="bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full font-button text-button active:scale-95 transition-transform">
                Hôm nay
            </button>
</section>
<!-- Filter Pills -->
<section class="flex gap-stack-sm overflow-x-auto pb-2 scrollbar-hide -mx-safe-margin px-safe-margin">
<button class="shrink-0 bg-primary-container text-on-primary rounded-full px-4 h-10 font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-sm">group</span> Tất cả
            </button>
<button class="shrink-0 bg-surface-container-high text-on-surface-variant border border-outline-variant rounded-full px-4 h-10 font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-sm">face</span> Bé Mỡ
            </button>
<button class="shrink-0 bg-surface-container-high text-on-surface-variant border border-outline-variant rounded-full px-4 h-10 font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-sm">pregnant_woman</span> Mẹ Linh
            </button>
</section>
<!-- Week Calendar View -->
<section class="bg-surface-container-lowest rounded-2xl p-4 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] flex justify-between">
<div class="flex flex-col items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant">T2</span>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-body-lg text-body-lg text-on-surface">16</div>
</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant">T3</span>
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-body-lg text-body-lg shadow-[0px_4px_12px_rgba(201,140,123,0.3)]">17</div>
</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant">T4</span>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-body-lg text-body-lg text-on-surface relative">
                    18
                    <div class="absolute bottom-1 w-1 h-1 rounded-full bg-primary"></div>
</div>
</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant">T5</span>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-body-lg text-body-lg text-on-surface">19</div>
</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant">T6</span>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-body-lg text-body-lg text-on-surface">20</div>
</div>
</section>
<!-- Event List -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Sự kiện hôm nay</h2>
<!-- Event Card 1 -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] flex gap-4 items-start relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container rounded-l-2xl"></div>
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">vaccines</span>
</div>
<div class="flex-1">
<h3 class="font-button text-button text-on-surface mb-1">Tiêm chủng - Bé Mỡ</h3>
<div class="flex items-center gap-2 text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-sm">schedule</span>
                        9:00 AM - 10:30 AM
                    </div>
</div>
</div>
<!-- Event Card 2 -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] flex gap-4 items-start relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary-fixed-dim rounded-l-2xl"></div>
<div class="w-12 h-12 rounded-xl bg-secondary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-2xl" style="font-variation-settings: 'FILL' 1;">medication</span>
</div>
<div class="flex-1">

<div class="flex items-center gap-2 text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-sm">schedule</span>
                        2:00 PM
                    </div>
</div>
</div>
<!-- Upcoming Event Card -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] flex gap-4 items-start relative overflow-hidden opacity-70">
<div class="w-12 h-12 rounded-xl bg-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant text-2xl" style="font-variation-settings: 'FILL' 1;">stroller</span>
</div>
<div class="flex-1">
<h3 class="font-button text-button text-on-surface mb-1">Đi dạo công viên</h3>
<div class="flex items-center gap-2 text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-sm">event</span>
                        Ngày mai, 4:00 PM
                    </div>
</div>
</div>

<span class="font-label-md text-label-md">Cộng đồng</span>
