<body class="bg-background text-on-background antialiased flex justify-center items-center min-h-screen">
<main class="w-[390px] h-[844px] bg-background relative overflow-hidden flex flex-col shadow-2xl">
<!-- Header (Contextual back, no brand anchor needed for transactional view) -->
<header class="flex items-center px-safe-margin h-[72px] shrink-0 bg-background z-10 sticky top-0">
<button aria-label="Quay lại" class="w-touch-target-min h-touch-target-min flex items-center justify-start rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-on-surface text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface flex-1 text-center pr-touch-target-min">Chia sẻ vị trí</h1>
</header>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto pb-stack-lg scrollbar-hide">
<!-- Map Preview Area -->
<div class="px-safe-margin mt-stack-sm mb-stack-lg">
<div class="w-full h-[240px] rounded-lg overflow-hidden relative shadow-soft bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A clean, minimalist map interface centered on Ho Chi Minh City, rendered in soft warm tones matching the app's organic minimal aesthetic. Light cream and beige landmasses with subtle brown roads and soft green park areas. A distinct, elegant marker or pulse indicates the current location. High resolution, flat vector style." data-location="Ho Chi Minh City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrVttUOSyhimEIpFCqrmsDRNsU-AZTN9-05mpK1qmUjKYjhJwZ8oE0FJBzhJR2Fcg9DEKsUmOlqMIr4YN1EecssKJEFNqLK0qAJapIjGp-rvIYWBeIfr6E8A_DTS0_EVXhtKRigC8FqOaffs9myJKSKUFlY60b6rPI2fGDO7EhccuSkbaTulMRmP_GIXerGnalaKwksYdX4k7yOTdPl8hhwSx50JdFUzx5pvPGBGieIy_nLmkiN0MaD-JTXki-jNZEvwcBDquND2U"/>
<!-- Overlay gradient for depth -->
<div class="absolute inset-0 bg-gradient-to-t from-surface/40 to-transparent pointer-events-none"></div>
<!-- Current Status Badge on Map -->
<div class="absolute top-4 left-4 bg-surface/90 backdrop-blur-sm px-4 py-2 rounded-full shadow-soft flex items-center gap-2 border border-outline-variant/50">
<span class="w-2.5 h-2.5 rounded-full bg-error animate-pulse"></span>
<span class="font-label-md text-label-md text-on-surface">Đang không chia sẻ</span>
</div>
</div>
</div>
<!-- Settings Card -->
<div class="px-safe-margin">
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-soft">
<!-- Toggle Row -->
<div class="flex justify-between items-center mb-stack-lg">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Trực tiếp</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Chia sẻ vị trí với chuyên gia tư vấn</p>
</div>
<!-- Custom Toggle -->
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" id="location-toggle" type="checkbox"/>
<div class="w-14 h-8 bg-surface-variant rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary-container shadow-inner"></div>
</label>
</div>
<div class="h-px bg-outline-variant/30 w-full mb-stack-lg"></div>
<!-- Duration Section -->
<div class="mb-stack-md opacity-50 pointer-events-none transition-opacity duration-300" id="duration-section">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-4">Thời lượng chia sẻ</h3>
<div class="grid grid-cols-3 gap-3">
<button class="py-3 px-2 rounded-lg border border-outline-variant bg-surface text-center active:scale-95 transition-transform duration-150 duration-btn" data-time="15m">
<span class="font-body-md text-body-md text-on-surface font-medium">15 phút</span>
</button>
<button class="py-3 px-2 rounded-lg border-2 border-primary bg-primary/5 text-center active:scale-95 transition-transform duration-150 duration-btn" data-time="1h">
<span class="font-body-md text-body-md text-primary font-semibold">1 giờ</span>
</button>
<button class="py-3 px-2 rounded-lg border border-outline-variant bg-surface text-center active:scale-95 transition-transform duration-150 duration-btn" data-time="8h">
<span class="font-body-md text-body-md text-on-surface font-medium">8 giờ</span>
</button>
</div>
<!-- Custom Duration -->
<button class="w-full mt-4 flex items-center justify-between py-4 px-4 bg-surface rounded-lg border border-outline-variant/50 active:bg-surface-variant transition-colors duration-200">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">schedule</span>
<span class="font-body-md text-body-md text-on-surface">Tùy chỉnh thời gian...</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</button>
</div>
</div>
</div>
<!-- Info Card -->
<div class="px-safe-margin mt-stack-md">
<div class="bg-secondary-container/30 rounded-xl p-4 flex gap-4">
<span class="material-symbols-outlined text-secondary shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-secondary-container">
                        Vị trí của bạn chỉ được chia sẻ trong thời gian bạn cho phép. Chuyên gia sẽ dùng thông tin này để hỗ trợ khẩn cấp hoặc đánh giá môi trường.
                    </p>
</div>
</div>
</div>
<!-- Sticky Bottom Actions -->
<div class="p-safe-margin bg-background/90 backdrop-blur-md shrink-0 border-t border-outline-variant/20 pb-[calc(24px+env(safe-area-inset-bottom))]">
<button class="w-full h-[52px] bg-surface-variant text-on-surface-variant font-button text-button rounded-full flex items-center justify-center gap-2 active:scale-95 transition-all duration-200 shadow-soft opacity-50 cursor-not-allowed" disabled="" id="start-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
                Bắt đầu chia sẻ
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('location-toggle');
            const durationSection = document.getElementById('duration-section');
            const startBtn = document.getElementById('start-btn');
            const durationBtns = document.querySelectorAll('.duration-btn');
            const statusIndicator = document.querySelector('.bg-error');
            const statusText = document.querySelector('.bg-surface\\/90 span:last-child');

            // Toggle Logic
            toggle.addEventListener('change', (e) => {
                const isActive = e.target.checked;
                
                if (isActive) {
                    durationSection.classList.remove('opacity-50', 'pointer-events-none');
                    
                    startBtn.disabled = false;
                    startBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                    startBtn.classList.add('bg-primary-container', 'text-white', 'shadow-active');
                    
                    statusIndicator.classList.remove('bg-error');
                    statusIndicator.classList.add('bg-[#4CAF50]'); // A custom green for active status
                    statusText.textContent = "Sẵn sàng chia sẻ";

                } else {
                    durationSection.classList.add('opacity-50', 'pointer-events-none');
                    
                    startBtn.disabled = true;
                    startBtn.classList.add('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                    startBtn.classList.remove('bg-primary-container', 'text-white', 'shadow-active');
                    startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">location_on</span> Bắt đầu chia sẻ';

                    statusIndicator.classList.add('bg-error');
                    statusIndicator.classList.remove('bg-[#4CAF50]', 'animate-pulse');
                    statusIndicator.classList.add('animate-pulse');
                    statusText.textContent = "Đang không chia sẻ";
                }
            });

            // Duration Selection Logic
            durationBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Reset all
                    durationBtns.forEach(b => {
                        b.classList.remove('border-2', 'border-primary', 'bg-primary/5');
                        b.classList.add('border', 'border-outline-variant', 'bg-surface');
                        b.querySelector('span').classList.remove('text-primary', 'font-semibold');
                        b.querySelector('span').classList.add('text-on-surface', 'font-medium');
                    });

                    // Set active
                    const target = e.currentTarget;
                    target.classList.remove('border', 'border-outline-variant', 'bg-surface');
                    target.classList.add('border-2', 'border-primary', 'bg-primary/5');
                    target.querySelector('span').classList.remove('text-on-surface', 'font-medium');
                    target.querySelector('span').classList.add('text-primary', 'font-semibold');
                });
            });

            // Start Action Logic
            startBtn.addEventListener('click', () => {
                if(!toggle.checked) return;

                const isSharing = startBtn.classList.contains('sharing');

                if(!isSharing) {
                    startBtn.classList.add('sharing');
                    startBtn.classList.remove('bg-primary-container');
                    startBtn.classList.add('bg-error', 'text-white');
                    startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">stop_circle</span> Dừng chia sẻ';
                    
                    statusText.textContent = "Đang chia sẻ trực tiếp";
                    // Lock toggle while sharing
                    toggle.disabled = true;
                    toggle.parentElement.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    startBtn.classList.remove('sharing');
                    startBtn.classList.remove('bg-error');
                    startBtn.classList.add('bg-primary-container');
                    startBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">location_on</span> Bắt đầu chia sẻ';
                    
                    statusText.textContent = "Sẵn sàng chia sẻ";
                    // Unlock toggle
                    toggle.disabled = false;
                    toggle.parentElement.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body></html>
