<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>

<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #271812; /* Simulate dark backdrop for modal */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Bottom sheet alignment */
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .bottom-sheet {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-on-background/50 backdrop-blur-sm">
<!-- Bottom Sheet Container -->
<main class="bottom-sheet w-full max-w-[390px] bg-surface rounded-t-xl shadow-[0_-4px_20px_rgba(90,70,63,0.15)] pb-safe relative">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-container-margin-mobile pb-container-margin-mobile pt-2 flex flex-col gap-6">
<!-- Header & Illustration -->
<div class="flex flex-col items-center text-center gap-4">
<div class="w-20 h-20 bg-primary-fixed rounded-full flex items-center justify-center shadow-[0_4px_12px_rgba(90,70,63,0.08)]">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">
                        photo_camera
                    </span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Cấp quyền Camera</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Ứng dụng cần sử dụng camera để phân tích tư thế của bạn trong các bài tập.
                </p>
</div>
<!-- Privacy Points (Bento-style list) -->
<div class="flex flex-col gap-3">
<div class="bg-surface-container-low rounded-DEFAULT p-4 flex items-start gap-4 border border-outline-variant/30">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">
                        shield_lock
                    </span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-[16px] leading-[24px]">Bảo mật tối đa</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Hình ảnh chỉ được xử lý trực tiếp trên thiết bị của bạn.</span>
</div>
</div>
<div class="bg-surface-container-low rounded-DEFAULT p-4 flex items-start gap-4 border border-outline-variant/30">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">
                        cloud_off
                    </span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-[16px] leading-[24px]">Không lưu trữ</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Chúng tôi cam kết không quay video hay lưu trữ bất kỳ hình ảnh nào.</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-2">
<button class="w-full h-12 bg-primary-container text-on-primary font-headline-md text-headline-md text-[16px] leading-[24px] rounded-full shadow-[0_4px_12px_rgba(90,70,63,0.15)] active:scale-95 transition-transform">
                    Cho phép
                </button>
<button class="w-full h-12 bg-transparent text-primary font-headline-md text-headline-md text-[16px] leading-[24px] rounded-full border-2 border-primary-container active:scale-95 transition-transform">
                    Hủy bỏ
                </button>
</div>
</div>
</main>
