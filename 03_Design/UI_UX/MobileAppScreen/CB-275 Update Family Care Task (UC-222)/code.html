<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cập nhật nhiệm vụ - CareBridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed-variant": "#693a2d",
                    "surface-accent-muted": "#F2EAE4",
                    "on-secondary-fixed-variant": "#4a4642",
                    "primary-fixed": "#ffdbd1",
                    "on-surface-variant": "#524440",
                    "tertiary-fixed": "#e6e2dd",
                    "tertiary": "#605e5a",
                    "on-primary": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#ccc5c0",
                    "on-primary-fixed": "#341006",
                    "text-heading": "#2D2A28",
                    "on-tertiary-fixed": "#1d1b19",
                    "inverse-surface": "#32302d",
                    "surface-variant": "#e7e1dd",
                    "on-surface": "#1d1b19",
                    "on-error": "#ffffff",
                    "surface-accent-light": "#F6F1EC",
                    "surface-container": "#f3ede8",
                    "background": "#fef8f4",
                    "tertiary-container": "#9e9a96",
                    "on-tertiary-container": "#34322f",
                    "status-active": "#C98C7B",
                    "surface-container-low": "#f9f2ee",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#484643",
                    "inverse-primary": "#fab7a4",
                    "tertiary-fixed-dim": "#cac6c1",
                    "secondary-container": "#e9e1db",
                    "text-body": "#524F4C",
                    "surface-main": "#FFFFFF",
                    "surface": "#fef8f4",
                    "primary-container": "#c98c7b",
                    "outline-variant": "#d6c2bd",
                    "surface-container-highest": "#e7e1dd",
                    "inverse-on-surface": "#f6f0eb",
                    "surface-tint": "#845143",
                    "surface-container-high": "#ede7e3",
                    "surface-dim": "#dfd9d5",
                    "secondary": "#625d59",
                    "on-secondary-container": "#68635f",
                    "error": "#ba1a1a",
                    "on-primary-container": "#51271b",
                    "on-background": "#1d1b19",
                    "outline": "#84736f",
                    "primary-fixed-dim": "#fab7a4",
                    "on-secondary-fixed": "#1e1b18",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#fef8f4",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#e9e1db",
                    "primary": "#845143",
                    "on-tertiary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "panel-gap": "24px",
                    "stack-md": "16px",
                    "stack-sm": "8px",
                    "grid-gutter": "24px",
                    "container-padding": "32px",
                    "sidebar-width": "280px"
            },
            "fontFamily": {
                    "headline-sm": ["Quicksand"],
                    "body-md": ["Quicksand"],
                    "nav-item": ["Quicksand"],
                    "label-md": ["Quicksand"],
                    "headline-md": ["Quicksand"],
                    "display-lg": ["Quicksand"],
                    "body-lg": ["Quicksand"]
            },
            "fontSize": {
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "nav-item": ["15px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fef8f4;
            color: #1d1b19;
            -webkit-tap-highlight-color: transparent;
        }
        .clay-card {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 4px 20px rgba(201, 140, 123, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        .focus-ring:focus-within {
            border-color: #C98C7B;
            box-shadow: 0 0 0 2px rgba(201, 140, 123, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Cập nhật nhiệm vụ</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A warm, professional headshot of a friendly female home care specialist with a kind smile, wearing a professional soft-toned uniform. The lighting is soft and natural, emphasizing a trustworthy and empathetic atmosphere consistent with a care-tech brand aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyT2KgyCFlvjY_cxaoqEgy-ENT4kMMc1C8aC3NVGcVJUIdroPp0CPtzZ2mVFHQwrAWnQIqZHUwJqTRVVwW-C-lsHEvoSZOR8vl-ucQNxrJwUn4UrIB378RE5FTunJ8KvRnS9Khp0QmXn2U1LgprmEcBM0wh1UXaTYbX93atg9__pu3vwF-Wum_kBp7k8VjxGA8DwceJ4hrndN-Z6PL_ti6_2WxzyTjpPU5lfJjwz7CxRRTnNsgDKN6inHqtrMNleHt_JWsR75c0DA"/>
</div>
</header>
<main class="pt-20 pb-28 px-4 max-w-2xl mx-auto">
<!-- Context Card -->
<section class="clay-card p-5 mb-6 bg-surface-accent-light flex items-center gap-4">
<div class="w-14 h-14 rounded-2xl bg-primary-container flex items-center justify-center text-on-primary-container shadow-sm">
<span class="material-symbols-outlined text-[32px]" data-icon="family_history">family_history</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary uppercase tracking-wider">Nhóm Chăm Sóc</p>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Gia đình Nguyễn</h2>
<div class="flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-body-md text-secondary" data-icon="visibility">visibility</span>
<span class="font-body-md text-body-md text-secondary">Mọi người trong nhóm có thể xem</span>
</div>
</div>
</section>
<!-- Form Section -->
<form class="space-y-6">
<!-- Title -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Tiêu đề nhiệm vụ</label>
<div class="clay-card px-5 py-4 focus-ring transition-all border-2 border-surface-accent-muted">
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface p-0" placeholder="Nhập tiêu đề..." type="text" value="Mua thuốc định kỳ cho Bà Nội"/>
</div>
</div>
<!-- Grid: Assignee & Category -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Người thực hiện</label>
<div class="clay-card px-4 py-3 flex items-center gap-3 border-2 border-surface-accent-muted cursor-pointer hover:bg-surface-accent-light transition-colors">
<div class="w-8 h-8 rounded-full overflow-hidden bg-secondary-container">
<img class="w-full h-full object-cover" data-alt="Close up profile photo of a friendly middle-aged man with a warm expression, representing a family member or caregiver in a modern home environment. Soft natural lighting, warm tones, high quality digital photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7ZiyibqbFhTFqFxy_2IzPb9TPUiaCwMsIlZPHuzeVy4wiTMBysV07Pgx0r02bZ2JOj--upwFHWBW7TIDSmJLamd31bIDRAbUdhcUH90JeH403oX3dwwxbRoZIr4plpQZDXD6Lxx7t42LtcAPzvwUCresxxyiChz5gZCyd76WG8o0TaKNA2PVsrUb2GcKX-_F_lCsD9hNSNGAHzdllejTGdwr-HxJAVRg2HTdhFmAst53zC5WKVxQJvrsJbE5JToO6_FbQzhMOVMk"/>
</div>
<span class="font-body-md text-body-md text-on-surface flex-grow">Anh Tuấn</span>
<span class="material-symbols-outlined text-outline" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Danh mục</label>
<div class="clay-card px-4 py-3 flex items-center gap-3 border-2 border-surface-accent-muted cursor-pointer hover:bg-surface-accent-light transition-colors">
<div class="w-8 h-8 rounded-lg bg-tertiary-fixed-dim flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-xl" data-icon="medical_services">medical_services</span>
</div>
<span class="font-body-md text-body-md text-on-surface flex-grow">Y tế</span>
<span class="material-symbols-outlined text-outline" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Grid: Due Date & Time -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Ngày hạn</label>
<div class="clay-card px-4 py-3 flex items-center gap-3 border-2 border-surface-accent-muted">
<span class="material-symbols-outlined text-primary text-xl" data-icon="calendar_today">calendar_today</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface p-0" type="text" value="25/10/2023"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Giờ</label>
<div class="clay-card px-4 py-3 flex items-center gap-3 border-2 border-surface-accent-muted">
<span class="material-symbols-outlined text-primary text-xl" data-icon="schedule">schedule</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface p-0" type="text" value="09:00 SA"/>
</div>
</div>
</div>
<!-- Reminder Selection -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Nhắc nhở</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border-2 border-primary bg-primary text-on-primary font-body-md text-body-md shadow-sm transition-all active:scale-95" type="button">30 phút trước</button>
<button class="px-4 py-2 rounded-full border-2 border-surface-accent-muted text-secondary font-body-md text-body-md hover:bg-surface-accent-light transition-all" type="button">1 giờ trước</button>
<button class="px-4 py-2 rounded-full border-2 border-surface-accent-muted text-secondary font-body-md text-body-md hover:bg-surface-accent-light transition-all" type="button">Trước 1 ngày</button>
</div>
</div>
<!-- Notes -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Ghi chú chi tiết</label>
<div class="clay-card px-5 py-4 focus-ring transition-all border-2 border-surface-accent-muted">
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface p-0 resize-none" placeholder="Thêm hướng dẫn chi tiết tại đây..." rows="4">Nhớ mua loại thuốc bổ khớp màu xanh dương, không phải loại màu trắng. Cần lấy hóa đơn để thanh toán bảo hiểm sau này.</textarea>
</div>
</div>
</form>
</main>
<!-- Fixed Action Footer -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-background/80 backdrop-blur-md z-50">
<div class="max-w-2xl mx-auto flex gap-4">
<button class="flex-1 py-4 clay-card border-2 border-surface-accent-muted text-secondary font-headline-sm text-headline-sm hover:bg-surface-accent-light transition-all active:scale-[0.98]">
                Hủy bỏ
            </button>
<button class="flex-[2] py-4 rounded-full bg-primary text-on-primary font-headline-sm text-headline-sm shadow-lg shadow-primary/20 hover:opacity-90 transition-all active:scale-[0.98]">
                Lưu thay đổi
            </button>
</div>
</div>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 -z-10 w-full h-full overflow-hidden opacity-30 pointer-events-none">
<div class="absolute -top-20 -right-20 w-96 h-96 rounded-full bg-primary-fixed blur-3xl animate-pulse"></div>
<div class="absolute bottom-40 -left-20 w-80 h-80 rounded-full bg-surface-container-high blur-3xl"></div>
</div>
<script>
        // Simple micro-interaction for chips
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                // If it's the reminder buttons
                if (this.parentElement.children.length > 1) {
                    this.parentElement.querySelectorAll('button').forEach(b => {
                        b.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                        b.classList.add('border-surface-accent-muted', 'text-secondary');
                    });
                    this.classList.remove('border-surface-accent-muted', 'text-secondary');
                    this.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                }
            });
        });

        // Save action feedback
        document.querySelector('button.bg-primary:not([type="button"])').addEventListener('click', function() {
            const originalText = this.innerText;
            this.innerText = 'Đang lưu...';
            setTimeout(() => {
                this.innerText = 'Đã cập nhật!';
                this.classList.replace('bg-primary', 'bg-status-active');
                setTimeout(() => {
                    this.innerText = originalText;
                    this.classList.replace('bg-status-active', 'bg-primary');
                }, 1500);
            }, 800);
        });
    </script>
</body></html>
