<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>

                        "secondary-fixed-dim": "#dbc1b7",
                        "outline": "#84736f",
                        "on-background": "#271812",
                        "surface": "#fff8f6",
                        "on-secondary-fixed-variant": "#55433b",

                        "primary-fixed-dim": "#fab7a4",
                        "tertiary-fixed": "#e9e1db",
                        "inverse-primary": "#fab7a4",

                    "borderRadius": {
                        "DEFAULT": "1rem",

                    },
                    "spacing": {
                        "stack-lg": "24px",

                        "touch-target-min": "48px",
                        "safe-margin": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Lexend"],
                        "body-lg": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "button": ["Lexend"],

                        "label-md": ["Lexend"]
                    },
                    "fontSize": {

                        "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]

<style>
        body { font-family: 'Lexend', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<div class="w-full max-w-[390px] min-h-screen relative shadow-[0px_4px_20px_rgba(90,70,63,0.06)] bg-surface flex flex-col">
<!-- TopAppBar (Customized for Edit Context) -->
<header class="flex justify-between items-center px-safe-margin h-touch-target-min w-full bg-background dark:bg-background top-0 sticky z-10 flat no shadows">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim text-center flex-1">
                Chỉnh sửa hồ sơ
            </h1>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-end text-primary font-button text-button hover:opacity-80 transition-opacity active:scale-95 duration-200">
                Lưu
            </button>
</header>
<!-- Main Content -->
<main class="flex-1 px-safe-margin py-stack-lg flex flex-col gap-stack-lg overflow-y-auto pb-[100px]">
<!-- Avatar Section -->
<div class="flex flex-col items-center justify-center gap-stack-sm">
<div class="relative">
<div class="w-[100px] h-[100px] rounded-full overflow-hidden border-4 border-surface-container-highest shadow-[0px_4px_20px_rgba(90,70,63,0.06)]">
<img alt="Profile Picture" class="w-full h-full object-cover" data-alt="A portrait of a beautiful, warm, and approachable young Vietnamese mother with a gentle smile, looking directly at the camera. The lighting is soft and natural, emphasizing a natural skin tone and a feeling of trustworthiness. The background is slightly blurred and features a soft, warm palette of muted peach and soft browns, aligning with the app's nurturing aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCzAHcTnoVL3ryP63eDOd6xB4Nk_06uFl96mi8LWw85IHZAG9dbVfMs7tCG9IQVuqCu9zbCM84-IlplNx6EjWX0PlfqlULTW0dXEzBmgCGgRMlHDzIHsNCck5yYLMo6GXrGtvT01iZEc8vutVQv-HbfRZ3Ll_JizrZzrK2EyKGvvxz3XixZ-s6S--rk0aP8j2h3Aa0wQ4gLDvdh2FJ3UYmdN2PbjGHxf-A7htFXk5a031XV_rY5sfPIaBHl8sDADR_YfZl5IxKZ60w"/>
</div>
<button class="absolute bottom-0 right-0 w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-[0px_4px_20px_rgba(90,70,63,0.12)] hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md mt-stack-md">
<!-- Field: Họ và tên -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Họ và tên</label>
<input class="w-full h-[56px] px-6 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-outline transition-colors" id="fullName" placeholder="Nhập họ và tên" type="text" value="Nguyễn Thị Mai"/>
</div>
<!-- Field: Số điện thoại (Locked) -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="phone">Số điện thoại</label>
<div class="relative flex items-center">
<input class="w-full h-[56px] px-6 rounded-full bg-surface-container-low border border-outline-variant text-on-surface-variant font-body-lg text-body-lg cursor-not-allowed opacity-80 pl-6 pr-14" disabled="" id="phone" type="text" value="09xx xxx 890"/>
<span class="material-symbols-outlined absolute right-5 text-on-surface-variant opacity-60">lock</span>
</div>
</div>
<!-- Field: Khu vực -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="location">Khu vực</label>
<div class="relative flex items-center">
<input class="w-full h-[56px] px-6 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-outline transition-colors pr-14" id="location" placeholder="Chọn khu vực" type="text" value="Quận 1, TP. HCM"/>
<span class="material-symbols-outlined absolute right-5 text-primary">expand_more</span>
</div>
</div>
<!-- Field: Giới thiệu bản thân -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="bio">Giới thiệu bản thân</label>
<textarea class="w-full px-6 py-4 rounded-xl bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-outline transition-colors resize-none" id="bio" placeholder="Chia sẻ đôi điều về bạn..." rows="4"></textarea>
</div>
</form>
</main>
</div>
</body></html>
