<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đổi mật khẩu - CareBridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#51271b",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#271812",
                        "primary-fixed": "#ffdbd1",
                        "surface-bright": "#fff8f6",
                        "on-primary-fixed": "#341006",
                        "background": "#fff8f6",
                        "surface-variant": "#fadcd3",
                        "inverse-on-surface": "#ffede7",
                        "on-secondary-fixed": "#271812",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#36322e",
                        "tertiary": "#625d59",
                        "secondary-container": "#f6dacf",
                        "on-tertiary-fixed-variant": "#4a4642",
                        "secondary-fixed-dim": "#dbc1b7",
                        "outline": "#84736f",
                        "on-background": "#271812",
                        "surface": "#fff8f6",
                        "on-secondary-fixed-variant": "#55433b",
                        "secondary": "#6e5a52",
                        "primary": "#845143",
                        "outline-variant": "#d6c2bd",
                        "on-secondary-container": "#735e56",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#fadcd3",
                        "on-tertiary-fixed": "#1e1b18",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-tint": "#845143",
                        "secondary-fixed": "#f8ddd2",
                        "surface-dim": "#f1d4ca",
                        "surface-container-high": "#ffe2d9",
                        "on-primary-fixed-variant": "#693a2d",
                        "surface-container-low": "#fff1ec",
                        "tertiary-fixed-dim": "#ccc5c0",
                        "on-surface-variant": "#524440",
                        "primary-container": "#c98c7b",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#fab7a4",
                        "tertiary-fixed": "#e9e1db",
                        "inverse-primary": "#fab7a4",
                        "tertiary-container": "#a09a95",
                        "inverse-surface": "#3e2c26",
                        "surface-container": "#ffe9e3"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "touch-target-min": "48px",
                        "safe-margin": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Lexend"],
                        "body-lg": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "button": ["Lexend"],
                        "headline-lg": ["Lexend"],
                        "display-lg": ["Lexend"],
                        "label-md": ["Lexend"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #F6F1EC;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col items-center">
<div class="w-full max-w-[390px] min-h-screen flex flex-col relative bg-background shadow-xl">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-safe-margin h-touch-target-min w-full docked full-width top-0 bg-background text-primary">
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min -ml-2 text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-primary text-center flex-1 pr-touch-target-min">Đổi mật khẩu</h1>
</header>
<!-- Main Content -->
<main class="flex-1 px-safe-margin py-stack-lg flex flex-col gap-stack-lg">
<p class="font-body-md text-body-md text-on-surface-variant mb-4">
                Vui lòng nhập mật khẩu hiện tại và tạo mật khẩu mới để bảo vệ tài khoản của bạn.
            </p>
<!-- Current Password -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-on-surface" for="current-password">Mật khẩu hiện tại</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" id="current-password" placeholder="Nhập mật khẩu hiện tại" type="password"/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-outline hover:text-primary transition-colors toggle-password">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- New Password -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-on-surface" for="new-password">Mật khẩu mới</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" id="new-password" placeholder="Nhập mật khẩu mới" type="password"/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-outline hover:text-primary transition-colors toggle-password">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm New Password -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Xác nhận mật khẩu mới</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" id="confirm-password" placeholder="Nhập lại mật khẩu mới" type="password"/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-outline hover:text-primary transition-colors toggle-password">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Password Policy -->
<div class="bg-surface-container-low rounded-DEFAULT p-4 mt-2">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-3 uppercase tracking-wider">Yêu cầu mật khẩu</h3>
<ul class="flex flex-col gap-2">
<li class="flex items-center gap-2 font-body-md text-body-md text-on-surface-variant">
<span class="material-symbols-outlined text-outline text-[18px]" data-icon="check_circle">check_circle</span>
                        Ít nhất 8 ký tự
                    </li>
<li class="flex items-center gap-2 font-body-md text-body-md text-on-surface-variant">
<span class="material-symbols-outlined text-outline text-[18px]" data-icon="check_circle">check_circle</span>
                        Bao gồm chữ và số
                    </li>
<li class="flex items-center gap-2 font-body-md text-body-md text-on-surface-variant">
<span class="material-symbols-outlined text-outline text-[18px]" data-icon="check_circle">check_circle</span>
                        Không trùng mật khẩu cũ
                    </li>
</ul>
</div>
</main>
<!-- Bottom Action Area -->
<div class="p-safe-margin bg-background">
<button class="w-full h-[52px] bg-primary-container text-on-secondary font-button text-button rounded-full flex items-center justify-center hover:opacity-90 transition-opacity active:scale-95 shadow-[0px_4px_20px_rgba(90,70,63,0.06)]">
                Cập nhật mật khẩu
            </button>
</div>
</div>
<script>
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                }
            });
        });
    </script>
</body></html>
