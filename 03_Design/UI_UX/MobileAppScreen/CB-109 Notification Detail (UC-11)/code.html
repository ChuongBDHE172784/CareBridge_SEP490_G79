<body class="bg-surface-container-low min-h-screen text-on-surface font-body-md antialiased flex flex-col md:max-w-md md:mx-auto md:shadow-2xl md:min-h-[844px] md:rounded-3xl md:my-8 relative overflow-hidden">
<!-- Top App Bar (Task-Focused / Detail Screen Variant) -->
<header class="fixed top-0 left-0 w-full md:absolute z-50 bg-surface-container-low flex justify-between items-center px-safe-margin h-[72px] transition-colors duration-300">
<!-- Leading Action: Back -->
<button aria-label="Quay lại" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface active:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-primary truncate flex-1 text-center px-4">Chi tiết thông báo</h1>
<!-- Trailing Action: Suppressed for focus -->
<div class="w-touch-target-min h-touch-target-min flex items-center justify-end">
<!-- Reserved space to keep headline centered -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-safe-margin pt-[88px] pb-safe-margin flex flex-col gap-stack-lg overflow-y-auto">
<!-- Notification Detail Card -->
<article class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_4px_20px_rgba(90,70,63,0.06)] flex flex-col gap-stack-md border border-surface-container-high/50">
<!-- Metadata Header -->
<div class="flex items-start justify-between border-b border-surface-container-high pb-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed-variant">
<span class="material-symbols-outlined fill text-[20px]">calendar_clock</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-secondary-fixed-variant uppercase tracking-wider">Lịch hẹn</span>
<span class="font-body-md text-body-md text-outline">10 phút trước</span>
</div>
</div>
</div>
<!-- Content Body -->
<div class="py-2 flex flex-col gap-3">
<h2 class="font-headline-md text-headline-md text-on-surface">Xác nhận lịch hẹn chuyên gia</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-[1.6]">
                    Lịch hẹn tư vấn dinh dưỡng của bạn đã được chuyên gia xác nhận vào lúc <strong class="text-primary font-medium">14:00 ngày 25/10/2023</strong>. Vui lòng có mặt đúng giờ.
                </p>
</div>
</article>
<!-- Action Area (Pushed to bottom of viewport structure) -->
<div class="mt-auto flex flex-col gap-stack-sm pt-8">
<!-- Primary CTA -->
<button class="w-full h-[52px] rounded-full bg-primary-container text-on-primary font-button text-button flex items-center justify-center active:scale-95 transition-transform shadow-[0px_8px_24px_rgba(90,70,63,0.12)]">
                Xem lịch hẹn
            </button>
<!-- Secondary CTA -->
<button class="w-full h-[52px] rounded-full bg-surface-container-highest text-on-surface-variant font-button text-button flex items-center justify-center active:scale-95 transition-transform">
                Đánh dấu đã đọc
            </button>
</div>
</main>
