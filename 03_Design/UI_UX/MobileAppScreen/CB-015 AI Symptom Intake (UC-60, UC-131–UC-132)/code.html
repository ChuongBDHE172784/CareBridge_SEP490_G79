<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Nhập liệu triệu chứng AI</title>

                        "tertiary": "#625d59",
                        "surface-container-lowest": "#ffffff",

                        "primary-container": "#c98c7b",
                        "surface-container-highest": "#fadcd3",
                        "inverse-on-surface": "#ffede7",
                        "on-primary": "#ffffff",
                        "surface": "#fff8f6",
                        "primary-fixed-dim": "#fab7a4",
                        "on-secondary-container": "#735e56",
                        "error": "#ba1a1a",
                        "secondary": "#6e5a52",
                        "on-error": "#ffffff",
                        "surface-tint": "#845143",
                        "on-primary-fixed-variant": "#693a2d",
                        "inverse-primary": "#fab7a4",
                        "tertiary-container": "#a09a95",
                        "surface-container": "#ffe9e3",
                        "on-secondary-fixed-variant": "#55433b",
                        "on-surface": "#271812",
                        "tertiary-fixed-dim": "#ccc5c0",
                        "surface-variant": "#fadcd3",

                        "outline-variant": "#d6c2bd",
                        "on-tertiary-container": "#36322e",
                        "inverse-surface": "#3e2c26",
                        "surface-dim": "#f1d4ca",
                        "secondary-fixed-dim": "#dbc1b7",
                        "on-background": "#271812",
                        "background": "#fff8f6",
                        "secondary-fixed": "#f8ddd2",
                        "on-surface-variant": "#524440",
                        "on-secondary-fixed": "#271812",
                        "surface-container-low": "#fff1ec",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#ffe2d9",
                        "on-tertiary-fixed-variant": "#4a4642",
                        "secondary-container": "#f6dacf",
                        "on-primary-fixed": "#341006"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "touch-target-min": "48px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "safe-margin": "24px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "headline-md": ["Lexend"],
                        "body-lg": ["Lexend"],
                        "label-md": ["Lexend"],
                        "headline-lg": ["Lexend"],

                        "button": ["Lexend"]
                    },
                    fontSize: {

                    }
                }
            }
        }

<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .option-card.selected {
            background-color: #fff1ec; /* surface-container-low */
            border-color: #c98c7b; /* primary-container */
            box-shadow: 0px 4px 20px rgba(90, 70, 63, 0.06);
        }
        .option-card.selected .check-icon {
            opacity: 1;
            color: #845143; /* primary */
        }
        .option-card.selected .option-text {
            color: #51271b; /* on-primary-container */
            font-weight: 500;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Top App Bar (Custom for flow, suppressing global nav) -->
<header class="flex justify-between items-center px-safe-margin h-touch-target-min w-full bg-background sticky top-0 z-40">
<button aria-label="Quay lại" class="w-[48px] h-[48px] flex items-center justify-start text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-primary">Kiểm tra triệu chứng</div>
<div class="w-[48px] h-[48px] flex items-center justify-end text-on-surface-variant">
<button aria-label="Trợ giúp" class="active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-safe-margin pt-stack-sm pb-[120px]">
<!-- Progress Indicator -->
<div aria-label="Bước 2 trên 5" class="flex items-center gap-2 mb-stack-lg">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
<!-- Question Title -->
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2">Bé nhà bạn đang gặp triệu chứng gì nổi bật nhất?</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Chọn một triệu chứng chính để AI có thể phân tích chính xác nhất.</p>
<!-- Selection Options -->
<div class="flex flex-col gap-stack-sm" id="options-container">
<!-- Option 1 -->
<button class="option-card group w-full min-h-[56px] bg-surface border border-outline-variant rounded-xl p-4 flex items-center justify-between transition-all duration-200 active:scale-[0.98] text-left">
<span class="option-text font-body-lg text-body-lg text-on-surface">Sốt cao (trên 38.5°C)</span>
<span class="check-icon material-symbols-outlined opacity-0 transition-opacity duration-200" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 2 -->
<button class="option-card group w-full min-h-[56px] bg-surface border border-outline-variant rounded-xl p-4 flex items-center justify-between transition-all duration-200 active:scale-[0.98] text-left">
<span class="option-text font-body-lg text-body-lg text-on-surface">Ho nhiều, khò khè</span>
<span class="check-icon material-symbols-outlined opacity-0 transition-opacity duration-200" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 3 -->
<button class="option-card group w-full min-h-[56px] bg-surface border border-outline-variant rounded-xl p-4 flex items-center justify-between transition-all duration-200 active:scale-[0.98] text-left">
<span class="option-text font-body-lg text-body-lg text-on-surface">Nôn trớ liên tục</span>
<span class="check-icon material-symbols-outlined opacity-0 transition-opacity duration-200" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 4 -->
<button class="option-card group w-full min-h-[56px] bg-surface border border-outline-variant rounded-xl p-4 flex items-center justify-between transition-all duration-200 active:scale-[0.98] text-left">
<span class="option-text font-body-lg text-body-lg text-on-surface">Tiêu chảy, phân bất thường</span>
<span class="check-icon material-symbols-outlined opacity-0 transition-opacity duration-200" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 5 - Other -->
<button class="option-card group w-full min-h-[56px] bg-surface border border-outline-variant rounded-xl p-4 flex items-center justify-between transition-all duration-200 active:scale-[0.98] text-left" id="btn-other">
<span class="option-text font-body-lg text-body-lg text-on-surface">Triệu chứng khác</span>
<span class="check-icon material-symbols-outlined opacity-0 transition-opacity duration-200" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
<!-- Hidden Input for "Other" -->
<div class="hidden mt-stack-sm overflow-hidden transition-all duration-300 opacity-0" id="other-input-container">
<label class="sr-only" for="other-symptom">Nhập triệu chứng khác</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-xl p-4 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none placeholder:text-outline-variant resize-none" id="other-symptom" placeholder="Vui lòng mô tả ngắn gọn triệu chứng của bé..." rows="3"></textarea>
</div>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 w-full bg-gradient-to-t from-background via-background to-transparent pt-8 pb-safe-margin px-safe-margin z-50">
<!-- AI Disclaimer -->
<div class="flex items-start gap-2 mb-stack-md px-2">
<span class="material-symbols-outlined text-[16px] text-primary mt-[2px]" style="font-variation-settings: 'FILL' 0;">psychiatry</span>
<p class="font-label-md text-label-md text-on-surface-variant">
                CareBridge AI hỗ trợ phân tích định hướng, <strong class="text-on-surface">không</strong> thay thế chẩn đoán y khoa chuyên nghiệp từ bác sĩ.
            </p>
</div>
<!-- Primary Action -->
<button class="w-full h-[52px] bg-primary-container text-on-primary rounded-full font-button text-button flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-[0px_8px_24px_rgba(90,70,63,0.12)]">
            Tiếp theo
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Simple Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.option-card');
            const otherBtn = document.getElementById('btn-other');
            const otherInputContainer = document.getElementById('other-input-container');
            const otherInput = document.getElementById('other-symptom');

            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected class from all
                    options.forEach(opt => opt.classList.remove('selected'));
                    
                    // Add selected class to clicked
                    this.classList.add('selected');

                    // Handle "Other" input visibility
                    if (this.id === 'btn-other') {
                        otherInputContainer.classList.remove('hidden');
                        // Small delay to allow display block to apply before opacity transition
                        setTimeout(() => {
                            otherInputContainer.classList.remove('opacity-0');
                        }, 10);
                        otherInput.focus();
                    } else {
                        otherInputContainer.classList.add('opacity-0');
                        // Wait for transition before hiding completely
                        setTimeout(() => {
                            if (!otherBtn.classList.contains('selected')) {
                                otherInputContainer.classList.add('hidden');
                            }
                        }, 300);
                    }
                });
            });
        });
    </script>
</body></html>
