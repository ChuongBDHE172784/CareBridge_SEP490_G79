<script>
        // Form Validation & Interaction Logic
        document.getElementById('health-record-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Simple validation example
            const titleInput = e.target.querySelector('input[type="text"]');
            const errorText = document.getElementById('title-error');
            
            if (!titleInput.value.trim()) {
                titleInput.classList.add('border-red-400');
                errorText.classList.remove('hidden');
                return;
            } else {
                titleInput.classList.remove('border-red-400');
                errorText.classList.add('hidden');
            }

            // Success animation/feedback simulation
            const btn = e.submitter || document.querySelector('.clay-button-primary');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Đang lưu...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Đã lưu thành công';
                btn.classList.replace('clay-button-primary', 'bg-green-500');
                btn.style.boxShadow = 'none';
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-green-500', 'clay-button-primary');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });

        // Add soft parallax movement to cards on mouse move for "Tactile Softness"
        document.querySelectorAll('.clay-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (y - centerY) / 25;
                const rotateY = (centerX - x) / 25;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
                card.style.transition = 'transform 0.5s ease';
            });
            
            card.addEventListener('mouseenter', () => {
                card.style.transition = 'none';
            });
        });
    </script>
