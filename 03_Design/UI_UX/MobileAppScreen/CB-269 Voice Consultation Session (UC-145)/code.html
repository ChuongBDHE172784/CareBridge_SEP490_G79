<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fef8f4;
            color: #1d1b19;
            overflow: hidden;
        }
        
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            background: rgba(201, 140, 123, 0.4);
            animation: pulse 2s infinite ease-out;
        }
        .pulse-ring-delayed {
            animation-delay: 1s;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .clay-card {
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(201, 140, 123, 0.08);
            border-radius: 2rem;
        }

        .clay-button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .clay-button:active {
            transform: scale(0.95);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>

<script>
        // Simple timer logic
        let seconds = 765; // 12:45
        const timerEl = document.getElementById('timer');
        
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }, 1000);

        // Interaction for mute button
        const muteBtn = document.getElementById('muteBtn');
        let isMuted = false;
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                muteBtn.classList.replace('bg-surface-container-low', 'bg-error-container');
                muteBtn.classList.add('text-error');
                muteBtn.querySelector('span').textContent = 'mic_off';
            } else {
                muteBtn.classList.replace('bg-error-container', 'bg-surface-container-low');
                muteBtn.classList.remove('text-error');
                muteBtn.querySelector('span').textContent = 'mic';
            }
        });

        // Atmospheric micro-interaction: subtle scale on voice pulse
        const avatar = document.querySelector('.pulse-ring');
        document.addEventListener('mousemove', (e) => {
            // Optional: slight parallax or reaction to interaction
        });
    </script>
