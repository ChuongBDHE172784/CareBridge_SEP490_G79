<style>
        body { font-family: 'Lexend', sans-serif; background-color: #F6F1EC; }
        .card-shadow { box-shadow: 0px 4px 20px rgba(90, 70, 63, 0.06); }
        .otp-input:focus { outline: none; border-color: #845143; ring-color: #845143; }
        .otp-input.error { border-color: #ba1a1a; background-color: #ffdad6; }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-safe-margin antialiased">
<!-- Normal State Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-lg p-stack-lg card-shadow mb-stack-lg flex flex-col items-center text-center">
<div class="mb-stack-md bg-secondary-container p-4 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="lock_clock" style="font-size: 32px;">lock_clock</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Nhập mã xác minh</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">
            Mã OTP gồm 6 chữ số đã được gửi đến số điện thoại<br/>
<strong class="font-button text-button text-on-surface">******890</strong>
</p>
<!-- OTP Input Group (Normal) -->
<div class="flex gap-2 justify-center mb-stack-lg w-full">
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors otp-input" maxlength="1" type="text" value="1"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors otp-input" maxlength="1" type="text" value="9"/>
<input autofocus="" class="w-12 h-14 text-center font-headline-lg text-headline-lg border-2 border-primary rounded-md bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors otp-input" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors otp-input" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors otp-input" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors otp-input" maxlength="1" type="text"/>
</div>
<button class="w-full bg-primary-container text-on-primary font-button text-button rounded-full h-[52px] flex items-center justify-center hover:bg-primary transition-colors mb-stack-md active:scale-95 duration-200 shadow-sm">
            Xác nhận
        </button>
<div class="flex items-center justify-center gap-1 font-body-md text-body-md text-on-surface-variant">
<span>Chưa nhận được mã?</span>
<button class="text-primary font-button text-button hover:underline bg-transparent border-none cursor-pointer flex items-center gap-1">
                Gửi lại mã
                <span class="text-on-surface-variant font-body-md text-body-md font-normal">(02:00)</span>
</button>
</div>
</main>
<!-- Error State Container -->
<section class="w-full max-w-md bg-surface-container-lowest rounded-lg p-stack-lg card-shadow flex flex-col items-center text-center border border-error-container">
<div class="mb-stack-md bg-error-container p-4 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-error" data-icon="error" style="font-size: 32px;">error</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Lỗi xác minh</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">
            Vui lòng kiểm tra lại mã đã nhập.
        </p>
<!-- OTP Input Group (Error) -->
<div class="flex gap-2 justify-center mb-stack-sm w-full">
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border-2 border-error rounded-md bg-error-container text-on-surface focus:outline-none otp-input error" disabled="" maxlength="1" type="text" value="1"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border-2 border-error rounded-md bg-error-container text-on-surface focus:outline-none otp-input error" disabled="" maxlength="1" type="text" value="2"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border-2 border-error rounded-md bg-error-container text-on-surface focus:outline-none otp-input error" disabled="" maxlength="1" type="text" value="3"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border-2 border-error rounded-md bg-error-container text-on-surface focus:outline-none otp-input error" disabled="" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border-2 border-error rounded-md bg-error-container text-on-surface focus:outline-none otp-input error" disabled="" maxlength="1" type="text" value="5"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg border-2 border-error rounded-md bg-error-container text-on-surface focus:outline-none otp-input error" disabled="" maxlength="1" type="text" value="9"/>
</div>
<p class="font-label-md text-label-md text-error w-full text-center mb-stack-lg">Mã OTP không hợp lệ</p>
<button class="w-full bg-surface-container-high text-on-surface font-button text-button rounded-full h-[52px] flex items-center justify-center hover:bg-surface-variant transition-colors active:scale-95 duration-200">
            Thử lại
        </button>
</section>
<script>
        // Simple logic to auto-focus next input for demonstration
        document.querySelectorAll('.otp-input:not(.error)').forEach((input, index, inputs) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
