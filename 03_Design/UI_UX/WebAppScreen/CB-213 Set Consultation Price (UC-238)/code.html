<body class="bg-background text-on-background antialiased flex h-screen overflow-hidden">
<!-- Background dimming for drawer effect -->
<div class="fixed inset-0 bg-on-background/30 z-40 transition-opacity duration-300"></div>
<!-- Drawer Component -->
<div class="fixed top-0 right-0 h-full w-[800px] bg-surface-container-lowest z-50 shadow-[-8px_0_24px_rgba(90,70,63,0.12)] flex flex-col transform transition-transform duration-300 rounded-l-xl">
<!-- Drawer Header -->
<div class="flex items-center justify-between px-8 py-6 border-b border-surface-variant bg-surface-bright rounded-tl-xl shrink-0">
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Set Consultation Price</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Configure pricing details for new consultation offerings.</p>
</div>
<button class="h-10 w-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Drawer Content Area (Split layout) -->
<div class="flex flex-1 overflow-hidden">
<!-- Left Side: Input Fields -->
<div class="w-1/2 p-8 overflow-y-auto flex flex-col gap-6 border-r border-surface-variant">
<!-- Channel Selection -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Consultation Channel</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center justify-center gap-2 p-3 rounded-lg border-2 border-primary bg-primary/5 cursor-pointer transition-colors">
<input checked="" class="hidden" name="channel" type="radio" value="video"/>
<span class="material-symbols-outlined text-primary" data-icon="videocam">videocam</span>
<span class="font-body-sm text-body-sm text-primary font-semibold">Video Call</span>
</label>
<label class="flex items-center justify-center gap-2 p-3 rounded-lg border border-outline-variant hover:bg-surface-container cursor-pointer transition-colors">
<input class="hidden" name="channel" type="radio" value="phone"/>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="call">call</span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-semibold">Phone</span>
</label>
</div>
</div>
<!-- Duration Selection -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Session Duration</label>
<select class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none font-body-lg text-body-lg text-on-surface transition-shadow">
<option value="15">15 Minutes (Brief)</option>
<option selected="" value="30">30 Minutes (Standard)</option>
<option value="45">45 Minutes (Extended)</option>
<option value="60">60 Minutes (Comprehensive)</option>
</select>
</div>
<!-- Value (Within Band) -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Price Value</label>
<span class="font-body-sm text-body-sm text-primary">Recommended band: $120 - $180</span>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-headline-md text-headline-md text-on-surface-variant">$</span>
<input class="w-full h-14 pl-8 pr-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none font-headline-md text-headline-md text-on-surface transition-shadow" max="500" min="50" step="10" type="number" value="150"/>
</div>
</div>
<!-- Effective Date -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Effective Date</label>
<div class="relative">
<input class="w-full h-12 pl-4 pr-10 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none font-body-lg text-body-lg text-on-surface transition-shadow appearance-none" type="date" value="2024-06-01"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="calendar_month">calendar_month</span>
</div>
</div>
</div>
<!-- Right Side: Public Preview -->
<div class="w-1/2 bg-surface-container p-8 flex flex-col">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-6 flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="visibility" data-weight="fill">visibility</span>
                    Public Preview
                </h3>
<div class="flex-1 flex items-center justify-center">
<!-- Preview Card -->
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgba(90,70,63,0.1)] overflow-hidden">
<div class="h-32 bg-primary-container relative">
<img class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="A softly lit, warm and inviting abstract background image representing healthcare professionalism. Minimalist flowing shapes in soft terracotta and beige tones, conveying trust and calm. High quality, modern clinical aesthetic, gentle gradients." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAO3cnR-E1_a0rM-NJGMyiWzQOR9Jq2cvpCQVO6u7jXAHXw2D8VIwJhIWIgzDmdWdc6oemIou8Al5COWDvMrH6Rvs11ux_wkhHng4moj-zZQ4Z1YPbSXhj_PrvRavdbbNhL7iQWkJaEmEyj-LxByOfITENSXCRcIwCKUNdgyMdi7e57645aPjKrsSjJ8qj1SlATGZp7Snb-oVFWJCjm5-LD-u7WwuEA-9vh8WTJV86GFfgENkX1lpPCW4e44L7QkymRdLR7PG5WzAM"/>
<div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black/50 to-transparent">
<span class="inline-flex items-center gap-1 bg-surface/90 text-primary px-2 py-1 rounded text-xs font-bold backdrop-blur-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="videocam" data-weight="fill">videocam</span>
                                    Video Consult
                                </span>
</div>
</div>
<div class="p-6">
<h4 class="font-headline-md text-headline-md text-on-surface mb-2">Standard Consultation</h4>
<div class="flex items-center gap-2 text-on-surface-variant font-body-sm text-body-sm mb-4">
<span class="material-symbols-outlined text-[18px]" data-icon="schedule">schedule</span>
<span>30 Minutes</span>
</div>
<div class="flex items-end justify-between mt-6 pt-4 border-t border-surface-variant">
<div>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Consultation Fee</span>
<span class="font-headline-lg text-headline-lg text-primary block mt-1">$150</span>
</div>
<button class="h-10 px-4 bg-primary text-on-primary rounded-full font-body-sm text-body-sm font-semibold hover:bg-surface-tint transition-colors">
                                    Book Now
                                </button>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Drawer Footer -->
<div class="p-6 border-t border-surface-variant bg-surface-bright rounded-bl-xl flex justify-end gap-4 shrink-0">
<button class="h-12 px-6 rounded-full border-2 border-primary text-primary font-body-lg text-body-lg font-semibold hover:bg-primary/5 transition-colors">
                Cancel
            </button>
<button class="h-12 px-8 rounded-full bg-primary text-on-primary font-body-lg text-body-lg font-semibold hover:bg-surface-tint transition-colors shadow-sm">
                Save Price Setting
            </button>
</div>
</div>
</body></html>
