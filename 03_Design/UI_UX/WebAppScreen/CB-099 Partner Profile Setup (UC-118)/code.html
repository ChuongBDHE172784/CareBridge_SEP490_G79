<body class="bg-background min-h-screen text-on-background font-body-md">
<!-- Top Navigation (Reduced for Setup) -->
<header class="bg-surface w-full h-16 flex justify-between items-center px-safe-margin border-b border-outline-variant/30 sticky top-0 z-50">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary font-bold">C</div>
<span class="font-display-lg text-[20px] leading-[28px] text-primary">CareBridge</span>
</div>
<div class="font-label-md text-label-md text-on-surface-variant bg-surface-container-low px-4 py-2 rounded-full">
            Bước 1/5: Thiết lập hồ sơ
        </div>
</header>
<main class="max-w-4xl mx-auto px-safe-margin py-stack-lg flex flex-col gap-stack-lg">
<div class="text-center mb-4">
<h1 class="font-display-lg text-display-lg text-primary mb-2">Chào mừng đối tác mới</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Vui lòng cung cấp thông tin để CareBridge xác thực dịch vụ của bạn.</p>
</div>
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-8 relative">
<div class="absolute left-0 top-1/2 w-full h-1 bg-surface-container-highest -z-10 -translate-y-1/2 rounded-full"></div>
<div class="absolute left-0 top-1/2 w-1/5 h-1 bg-primary-container -z-10 -translate-y-1/2 rounded-full"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-bold">1</div>
<span class="font-label-md text-label-md text-primary">Tổ chức</span>
</div>
<div class="flex flex-col items-center gap-2 step-inactive">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">2</div>
<span class="font-label-md text-label-md text-on-surface-variant">Đại diện</span>
</div>
<div class="flex flex-col items-center gap-2 step-inactive">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">3</div>
<span class="font-label-md text-label-md text-on-surface-variant">Cơ sở</span>
</div>
<div class="flex flex-col items-center gap-2 step-inactive">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">4</div>
<span class="font-label-md text-label-md text-on-surface-variant">Dịch vụ</span>
</div>
<div class="flex flex-col items-center gap-2 step-inactive">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">5</div>
<span class="font-label-md text-label-md text-on-surface-variant">Tài liệu</span>
</div>
</div>
<!-- Section 1: Thông tin tổ chức -->
<section class="bg-surface rounded-xl p-[24px] card-shadow">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">corporate_fare</span>
                Thông tin tổ chức
            </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Tên tổ chức / Phòng khám *</label>
<input class="h-[56px] px-4 rounded-lg border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-background placeholder:text-outline-variant bg-white" placeholder="Nhập tên tổ chức..." type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Mã số thuế / Giấy phép ĐKKD *</label>
<input class="h-[56px] px-4 rounded-lg border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-background placeholder:text-outline-variant bg-white" placeholder="VD: 0101234567" type="text"/>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant">Loại hình cơ sở *</label>
<div class="flex flex-wrap gap-3">
<label class="flex items-center gap-2 px-4 py-3 border border-outline-variant/50 rounded-full cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container/20 has-[:checked]:border-primary-container has-[:checked]:text-primary">
<input checked="" class="text-primary focus:ring-primary" name="facility_type" type="radio"/>
<span class="font-body-md text-body-md">Phòng khám Nhi / Sản</span>
</label>
<label class="flex items-center gap-2 px-4 py-3 border border-outline-variant/50 rounded-full cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container/20 has-[:checked]:border-primary-container has-[:checked]:text-primary">
<input class="text-primary focus:ring-primary" name="facility_type" type="radio"/>
<span class="font-body-md text-body-md">Trung tâm tư vấn Tâm lý</span>
</label>
<label class="flex items-center gap-2 px-4 py-3 border border-outline-variant/50 rounded-full cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container/20 has-[:checked]:border-primary-container has-[:checked]:text-primary">
<input class="text-primary focus:ring-primary" name="facility_type" type="radio"/>
<span class="font-body-md text-body-md">Dịch vụ chăm sóc tại nhà</span>
</label>
</div>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant">Mô tả ngắn gọn</label>
<textarea class="p-4 rounded-lg border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-background placeholder:text-outline-variant bg-white resize-none" placeholder="Giới thiệu về dịch vụ và triết lý chăm sóc của bạn..." rows="3"></textarea>
</div>
</div>
</section>
<!-- Actions -->
<div class="flex justify-end gap-4 mt-4 mb-12">
<button class="h-[52px] px-8 rounded-full bg-surface-container-highest text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-outline-variant/30 transition-colors">
                Lưu nháp
            </button>
<button class="h-[52px] px-8 rounded-full bg-primary-container text-on-primary font-button text-button flex items-center justify-center gap-2 hover:bg-primary transition-colors active-shadow">
                Tiếp tục
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
