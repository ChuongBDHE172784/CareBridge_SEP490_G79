<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Đăng nhập</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-dim": "#f1d4ca",
                      "surface-container-highest": "#fadcd3",
                      "surface": "#fff8f6",
                      "secondary-container": "#f6dacf",
                      "primary": "#845143",
                      "on-tertiary-container": "#36322e",
                      "on-secondary-container": "#735e56",
                      "surface-variant": "#fadcd3",
                      "on-secondary-fixed": "#271812",
                      "on-primary-container": "#51271b",
                      "tertiary": "#625d59",
                      "secondary-fixed": "#f8ddd2",
                      "on-tertiary": "#ffffff",
                      "surface-container-low": "#fff1ec",
                      "on-primary-fixed": "#341006",
                      "surface-container": "#ffe9e3",
                      "inverse-on-surface": "#ffede7",
                      "on-error-container": "#93000a",
                      "on-surface": "#271812",
                      "on-secondary-fixed-variant": "#55433b",
                      "primary-container": "#c98c7b",
                      "tertiary-fixed": "#e9e1db",
                      "secondary-fixed-dim": "#dbc1b7",
                      "surface-container-high": "#ffe2d9",
                      "on-tertiary-fixed-variant": "#4a4642",
                      "on-primary": "#ffffff",
                      "tertiary-container": "#a09a95",
                      "inverse-primary": "#fab7a4",
                      "primary-fixed": "#ffdbd1",
                      "inverse-surface": "#3e2c26",
                      "surface-tint": "#845143",
                      "tertiary-fixed-dim": "#ccc5c0",
                      "on-background": "#271812",
                      "background": "#fff8f6",
                      "outline-variant": "#d6c2bd",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff",
                      "secondary": "#6e5a52",
                      "primary-fixed-dim": "#fab7a4",
                      "outline": "#84736f",
                      "on-surface-variant": "#524440",
                      "on-primary-fixed-variant": "#693a2d",
                      "error-container": "#ffdad6",
                      "error": "#ba1a1a",
                      "surface-bright": "#fff8f6",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed": "#1e1b18"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "8px",
                      "stack-md": "16px",
                      "touch-target-min": "48px",
                      "gutter": "16px",
                      "stack-lg": "24px",
                      "safe-margin": "24px"
              },
              "fontFamily": {
                      "display-lg": ["Lexend"],
                      "button": ["Lexend"],
                      "headline-lg": ["Lexend"],
                      "body-md": ["Lexend"],
                      "label-md": ["Lexend"],
                      "headline-md": ["Lexend"],
                      "body-lg": ["Lexend"]
              },
              "fontSize": {
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "button": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            box-shadow: 0px 4px 20px rgba(90, 70, 63, 0.06);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md overflow-hidden antialiased">
<!-- Decorative Abstract Shapes (Warm Accents) -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[-20%] right-[-10%] w-[800px] h-[800px] rounded-full bg-surface-container-low opacity-50 blur-[120px]"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-secondary-container opacity-30 blur-[100px]"></div>
</div>
<!-- Main Login Container -->
<main class="w-full max-w-md px-safe-margin z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 sm:p-10 soft-shadow flex flex-col gap-8">
<!-- Logo & Brand -->
<div class="flex flex-col items-center justify-center gap-4 text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined filled-icon text-on-primary text-[32px]">child_care</span>
</div>
<div>
<h1 class="font-display-lg text-display-lg text-primary">CareBridge</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Cổng thông tin chuyên gia</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email/Phone Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="username">Email hoặc Số điện thoại</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">person</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-full font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="username" name="username" placeholder="Nhập email hoặc số điện thoại" type="text" value="nguyen.thianh@carebridge.vn"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full h-[56px] pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-full font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" type="password" value="********"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">Quên mật khẩu?</a>
</div>
<!-- Submit Button -->
<button class="h-[52px] w-full bg-primary-container text-on-primary rounded-full font-button text-button hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 shadow-sm" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined filled-icon">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-8 flex justify-center items-center gap-6 text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-[18px]">support_agent</span>
                Hỗ trợ kỹ thuật
            </a>
<span class="text-outline-variant">•</span>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-[18px]">shield</span>
                Chính sách bảo mật
            </a>
</div>
</main>
<script>
        // Simple password toggle interaction
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const icon = toggleBtn.querySelector('.material-symbols-outlined');

            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    passwordInput.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body></html>
