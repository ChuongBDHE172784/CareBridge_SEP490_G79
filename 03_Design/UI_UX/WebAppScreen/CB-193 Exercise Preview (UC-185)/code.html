<style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fef8f4; color: #1d1b19; margin: 0; min-height: 100vh; overflow: hidden; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        
        /* Mobile Device Frame styling */
        .device-frame {
            width: 390px;
            height: 844px;
            border-radius: 40px;
            border: 12px solid #32302d;
            background-color: #ffffff;
            box-shadow: 0 24px 60px rgba(45, 42, 40, 0.15), 0 0 0 2px rgba(255,255,255,0.5) inset;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            transform-origin: center center;
        }
        
        .device-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #32302d;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 50;
        }

        .ambient-shadow {
            box-shadow: 0 4px 20px rgba(201, 140, 123, 0.08);
        }

        /* Subtle backdrop blur for focus mode */
        .preview-backdrop {
            background-color: rgba(254, 248, 244, 0.9);
            backdrop-filter: blur(8px);
        }
    </style>
