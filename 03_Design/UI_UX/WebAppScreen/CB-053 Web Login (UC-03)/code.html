<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareBridge - Đăng nhập</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#f8ddd2",
                        "tertiary-container": "#a09a95",
                        "on-secondary-fixed-variant": "#55433b",
                        "inverse-surface": "#3e2c26",
                        "surface-variant": "#fadcd3",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#4a4642",
                        "on-tertiary-container": "#36322e",
                        "error-container": "#ffdad6",
                        "primary": "#845143",
                        "on-surface": "#271812",
                        "on-primary-fixed": "#341006",
                        "on-primary-container": "#51271b",
                        "tertiary-fixed": "#e9e1db",
                        "outline": "#84736f",
                        "surface": "#fff8f6",
                        "surface-container": "#ffe9e3",
                        "on-primary-fixed-variant": "#693a2d",
                        "primary-container": "#c98c7b",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary": "#6e5a52",
                        "inverse-on-surface": "#ffede7",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#fab7a4",
                        "on-surface-variant": "#524440",
                        "tertiary": "#625d59",
                        "background": "#F6F1EC", /* Custom light warm accent */
                        "on-background": "#271812",
                        "surface-dim": "#f1d4ca",
                        "on-tertiary-fixed": "#1e1b18",
                        "on-secondary-fixed": "#271812",
                        "primary-fixed-dim": "#fab7a4",
                        "surface-bright": "#fff8f6",
                        "tertiary-fixed-dim": "#ccc5c0",
                        "secondary-container": "#f6dacf",
                        "surface-container-high": "#ffe2d9",
                        "on-secondary-container": "#735e56",
                        "surface-container-low": "#fff1ec",
                        "secondary-fixed-dim": "#dbc1b7",
                        "primary-fixed": "#ffdbd1",
                        "surface-container-highest": "#fadcd3",
                        "outline-variant": "#d6c2bd",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-tint": "#845143"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "gutter": "16px",
                        "safe-margin": "24px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Lexend"],
                        "display-lg": ["Lexend"],
                        "label-md": ["Lexend"],
                        "headline-lg": ["Lexend"],
                        "body-lg": ["Lexend"],
                        "button": ["Lexend"],
                        "body-md": ["Lexend"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #F6F1EC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card-shadow {
            box-shadow: 0 10px 40px -10px rgba(132, 81, 67, 0.1);
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }
    </style>
</head>
<body class="bg-[#F6F1EC] text-on-surface antialiased h-[1024px] w-[1440px] mx-auto overflow-hidden relative">
<!-- Decorative subtle background blobs (optional) -->
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-surface-container-highest rounded-full blur-[100px] opacity-40 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[50%] h-[50%] bg-[#f8ddd2] rounded-full blur-[120px] opacity-30 pointer-events-none"></div>
<main class="relative z-10 w-full max-w-[480px] p-safe-margin">
<div class="bg-surface-container-lowest rounded-xl p-8 sm:p-12 login-card-shadow border border-outline-variant/30 flex flex-col gap-8">
<!-- Logo Header -->
<div class="text-center flex flex-col items-center gap-4">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-display-lg">
                        healing
                    </span>
</div>
<div>
<h1 class="text-headline-lg text-primary tracking-tight">CareBridge</h1>
<p class="text-body-md text-on-surface-variant mt-1">Hệ thống quản lý y tế</p>
</div>
</div>
<!-- Validation Message (Hidden by default, shown here as example) -->
<!-- <div class="bg-error-container text-on-error-container p-4 rounded-lg flex items-start gap-3">
                <span class="material-symbols-outlined text-[20px] shrink-0 mt-0.5">error</span>
                <p class="text-body-md">Email hoặc mật khẩu không chính xác. Vui lòng thử lại.</p>
            </div> -->
<!-- Login Form -->
<form action="#" class="flex flex-col gap-6" method="POST">
<div class="flex flex-col gap-4">
<!-- Email/Phone Field -->
<div class="flex flex-col gap-2">
<label class="text-label-md text-on-surface" for="username">Email hoặc Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">
                                person
                            </span>
<input class="w-full h-touch-target-min pl-11 pr-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="username" name="username" placeholder="Nhập email hoặc SĐT" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="text-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">
                                lock
                            </span>
<input class="w-full h-touch-target-min pl-11 pr-11 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">
                                    visibility_off
                                </span>
</button>
</div>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest" type="checkbox"/>
<span class="text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Ghi nhớ tôi</span>
</label>
<a class="text-body-md text-primary font-medium hover:text-primary-container transition-colors" href="#">
                        Quên mật khẩu?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min bg-[#C98C7B] hover:bg-primary text-white text-button rounded-full transition-colors flex items-center justify-center gap-2 mt-2" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="text-center pt-4 border-t border-outline-variant/30">
<p class="text-body-md text-on-surface-variant">
                    Cần trợ giúp? <a class="text-primary font-medium hover:underline" href="#">Hỗ trợ kỹ thuật</a>
</p>
</div>
</div>
</main>
</body></html>
