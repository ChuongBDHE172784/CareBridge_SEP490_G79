stages: [validate, test, security, build, publish, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_BUILDKIT: "1"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  WEB_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  EVALUATION_IMAGE: "$CI_REGISTRY_IMAGE/ai-evaluator:$CI_COMMIT_SHORT_SHA"

.all_rules: &all_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: ["05_Development/CareBridgeAPI/**/*", "05_Development/CareBridgeWebApp/**/*", ".gitlab-ci.yml", ".semgrep.yml", ".trivyignore", "05_Development/Deployment/**/*"]
.backend_rules: &backend_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: ["05_Development/CareBridgeAPI/**/*", ".gitlab-ci.yml", ".semgrep.yml", ".trivyignore"]
.web_rules: &web_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: ["05_Development/CareBridgeWebApp/**/*", ".gitlab-ci.yml", ".semgrep.yml", ".trivyignore"]
.evaluation_rules: &evaluation_rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: ["06_Testing/CareBridgeAIEvaluation/**/*", "05_Development/CareBridgeAITriageService/**/*", ".gitlab-ci.yml"]

validate_backend:
  stage: validate
  image: eclipse-temurin:21-jdk
  rules: *backend_rules
  script: ["cd 05_Development/CareBridgeAPI", "./mvnw -B -DskipTests compile"]
database_gate0_audit:
  stage: validate
  image: eclipse-temurin:21-jdk
  services: [{name: "docker:27.5.1-dind", alias: docker}]
  timeout: 20 minutes
  environment: {name: gate0-audit, action: verify}
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $GATE0_ENABLED == "true" && $GATE0_DB_URL && $GATE0_DB_USERNAME && $GATE0_DB_PASSWORD'
      when: manual
      allow_failure: true
    - when: never
  script:
    - test -n "$GATE0_DB_URL" && test -n "$GATE0_DB_USERNAME" && test -n "$GATE0_DB_PASSWORD"
    - cd 05_Development/CareBridgeAPI
    - ./mvnw -B -Dtest=FlywayMigrationChainTest,DatabaseGate0IntegrationTest,DatabaseGate0ManifestTest -Dgate0.enabled=true test
  artifacts:
    when: always
    paths: ["05_Development/CareBridgeAPI/target/gate0/"]
    reports: {junit: "05_Development/CareBridgeAPI/target/surefire-reports/TEST-*.xml"}
validate_web:
  stage: validate
  image: node:22-alpine
  rules: *web_rules
  script: ["cd 05_Development/CareBridgeWebApp", "npm ci", "npm run lint"]
validate_ai_evaluation:
  stage: validate
  image: python:3.12-slim
  rules: *evaluation_rules
  script:
    - cd 06_Testing/CareBridgeAIEvaluation
    - python -m pip install --disable-pip-version-check -e ".[dev]"
    - carebridge-eval validate datasets/benchmark_cases.json
    - carebridge-eval export-schema /tmp/carebridge-evaluation-case-schema.json
    - ruff check src tests scripts
test_backend:
  stage: test
  image: eclipse-temurin:21-jdk
  services: [{name: "docker:27.5.1-dind", alias: docker}]
  timeout: 30 minutes
  variables:
    SPRING_APPLICATION_JSON: '{"logging":{"level":{"root":"WARN","org.hibernate.SQL":"OFF","org.hibernate.type.descriptor.sql":"OFF","org.springframework.orm":"WARN","com.carebridge.backend":"WARN"}}}'
  rules: *backend_rules
  script: ["cd 05_Development/CareBridgeAPI", "./mvnw -B -Dmaven.test.redirectTestOutputToFile=true test"]
  artifacts:
    when: always
    paths: ["05_Development/CareBridgeAPI/target/surefire-reports/"]
    reports: {junit: "05_Development/CareBridgeAPI/target/surefire-reports/TEST-*.xml"}
test_web:
  stage: test
  image: node:22-alpine
  rules: *web_rules
  script: ["cd 05_Development/CareBridgeWebApp", "npm ci", "npm run build", "echo 'No web test script is configured; build is the available verification.'"]
test_ai_evaluation:
  stage: test
  image: python:3.12-slim
  rules: *evaluation_rules
  script:
    - python -m pip install --disable-pip-version-check -r 05_Development/CareBridgeAITriageService/requirements.txt
    - python -m pip install --disable-pip-version-check -e "06_Testing/CareBridgeAIEvaluation[dev]"
    - cd 06_Testing/CareBridgeAIEvaluation
    - pytest --junitxml=reports/evaluation-junit.xml
    - GEMINI_ENABLED=false carebridge-eval run --mode local --output-dir reports/ci
  artifacts:
    when: always
    paths: ["06_Testing/CareBridgeAIEvaluation/reports/ci/"]
    reports: {junit: "06_Testing/CareBridgeAIEvaluation/reports/evaluation-junit.xml"}

test_ai_evaluation_api:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CAREBRIDGE_API_BASE_URL && $CAREBRIDGE_TEST_JWT && $CAREBRIDGE_TEST_BABY_PROFILE_ID && $CAREBRIDGE_TEST_MOTHER_PROFILE_ID'
      changes: ["06_Testing/CareBridgeAIEvaluation/**/*", "05_Development/CareBridgeAPI/**/*", "05_Development/CareBridgeAITriageService/**/*"]
  script:
    - python -m pip install --disable-pip-version-check -e "06_Testing/CareBridgeAIEvaluation"
    - cd 06_Testing/CareBridgeAIEvaluation
    - python scripts/run_api_preflight.py
    - carebridge-eval run --mode api --output-dir reports/api-ci
  artifacts: {when: always, paths: ["06_Testing/CareBridgeAIEvaluation/reports/api-ci/"]}

test_ai_evaluation_promptfoo:
  stage: test
  image: node:22-alpine
  rules: *evaluation_rules
  script:
    - apk add --no-cache python3 py3-pip
    - python3 -m venv .evaluation-venv
    - . .evaluation-venv/bin/activate
    - python -m pip install --disable-pip-version-check -r 05_Development/CareBridgeAITriageService/requirements.txt
    - python -m pip install --disable-pip-version-check -e 06_Testing/CareBridgeAIEvaluation
    - npm install --global promptfoo
    - cd 06_Testing/CareBridgeAIEvaluation
    - node --version
    - promptfoo --version
    - python scripts/run_promptfoo.py --output-dir reports/promptfoo-ci
  artifacts: {when: always, paths: ["06_Testing/CareBridgeAIEvaluation/reports/promptfoo-ci/"]}

test_ai_evaluation_galileo:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$GALILEO_ENABLED == "true" && $GALILEO_API_KEY && $GALILEO_PROJECT'
      changes: ["06_Testing/CareBridgeAIEvaluation/**/*"]
  script:
    - python -m pip install --disable-pip-version-check -e "06_Testing/CareBridgeAIEvaluation" galileo
    - cd 06_Testing/CareBridgeAIEvaluation
    - carebridge-eval run --mode local --output-dir reports/galileo-input
    - python scripts/run_galileo.py reports/galileo-input/report.json
  artifacts: {when: always, paths: ["06_Testing/CareBridgeAIEvaluation/reports/galileo-input/"]}

semgrep_sast:
  stage: security
  image:
    name: semgrep/semgrep:1.123.0
    entrypoint: [""]
  dependencies: []
  variables:
    GIT_DEPTH: "0"
  rules: *all_rules
  script:
    - |
      baseline_ref=""
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        baseline_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        baseline_ref="$CI_COMMIT_BEFORE_SHA"
      elif git rev-parse "${CI_COMMIT_SHA}^" >/dev/null 2>&1; then
        baseline_ref="${CI_COMMIT_SHA}^"
      fi

      if [ -n "$baseline_ref" ]; then
        semgrep scan --oss-only --jobs 2 --error --baseline-commit "$baseline_ref" --config p/default --config .semgrep.yml --gitlab-sast-output semgrep-report.json .
      else
        semgrep scan --oss-only --jobs 2 --error --config p/default --config .semgrep.yml --gitlab-sast-output semgrep-report.json .
      fi
  artifacts:
    when: always
    reports: {sast: semgrep-report.json}
trivy_fs:
  stage: security
  image:
    name: aquasec/trivy:0.59.1
    entrypoint: [""]
  dependencies: []
  rules: *all_rules
  script:
    - trivy --timeout 10m fs --ignorefile .trivyignore --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format template --template '@/contrib/gitlab.tpl' --output trivy-fs-report.json .
    - trivy --timeout 10m fs --ignorefile .trivyignore --scanners vuln,secret,misconfig --severity CRITICAL --exit-code 1 .
  artifacts: {when: always, paths: [trivy-fs-report.json]}
trivy_fs_high_advisory:
  stage: security
  image:
    name: aquasec/trivy:0.59.1
    entrypoint: [""]
  dependencies: []
  rules: *all_rules
  allow_failure: true
  script: ["trivy --timeout 10m fs --ignorefile .trivyignore --scanners vuln,secret,misconfig --severity HIGH --exit-code 1 ."]

ai_evaluation_security:
  stage: security
  image: python:3.12-slim
  rules: *evaluation_rules
  script:
    - cd 06_Testing/CareBridgeAIEvaluation
    - python -m pip install --disable-pip-version-check -e ".[dev]"
    - bandit -q -r src scripts
    - python scripts/run_dependency_audit.py

ai_evaluation_gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  rules: *evaluation_rules
  script:
    - gitleaks detect --source 06_Testing/CareBridgeAIEvaluation --no-git --redact --exit-code 1

.docker_build:
  stage: build
  image: docker:27.5.1-cli
  services: [{name: "docker:27.5.1-dind", alias: docker}]
  script: ["docker build --pull --build-arg VITE_API_URL=${VITE_API_URL:-} --tag $IMAGE $CONTEXT", "docker save $IMAGE --output $ARCHIVE"]
  artifacts: {paths: ["$ARCHIVE"], expire_in: 1 day}
build_backend_image:
  extends: .docker_build
  rules: *backend_rules
  variables: {IMAGE: "$BACKEND_IMAGE", CONTEXT: 05_Development/CareBridgeAPI, ARCHIVE: backend-image.tar}
build_web_image:
  extends: .docker_build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["05_Development/CareBridgeWebApp/**/*", ".gitlab-ci.yml", ".semgrep.yml", ".trivyignore"]
      variables: {VITE_API_URL: "https://api.example.invalid"}
  variables: {IMAGE: "$WEB_IMAGE", CONTEXT: 05_Development/CareBridgeWebApp, ARCHIVE: web-image.tar}
  before_script: ["test -n \"$VITE_API_URL\" || { echo 'VITE_API_URL is required to prevent a localhost API bundle'; exit 1; }"]
build_ai_evaluation_image:
  stage: build
  image: docker:27.5.1-cli
  services: [{name: "docker:27.5.1-dind", alias: docker}]
  rules: *evaluation_rules
  script:
    - docker build --pull --build-context ai-service=05_Development/CareBridgeAITriageService --tag "$EVALUATION_IMAGE" 06_Testing/CareBridgeAIEvaluation
    - docker run --rm --entrypoint python "$EVALUATION_IMAGE" -m pytest -q /opt/carebridge/evaluator/tests
    - docker save "$EVALUATION_IMAGE" --output ai-evaluation-image.tar
  artifacts: {paths: [ai-evaluation-image.tar], expire_in: 1 day}

scan_ai_evaluation_image:
  extends: .image_scan
  rules: *evaluation_rules
  needs: [{job: build_ai_evaluation_image, artifacts: true}]
  variables: {ARCHIVE: ai-evaluation-image.tar}

.image_scan:
  stage: publish
  image:
    name: aquasec/trivy:0.59.1
    entrypoint: [""]
  script: ["trivy image --input $ARCHIVE --ignorefile .trivyignore --severity CRITICAL --exit-code 1"]
scan_backend_image:
  extends: .image_scan
  rules: *backend_rules
  needs: [{job: build_backend_image, artifacts: true}]
  variables: {ARCHIVE: backend-image.tar}
scan_web_image:
  extends: .image_scan
  rules: *web_rules
  needs: [{job: build_web_image, artifacts: true}]
  variables: {ARCHIVE: web-image.tar}

.publish:
  stage: publish
  image: docker:27.5.1-cli
  services: [{name: "docker:27.5.1-dind", alias: docker}]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script: ["echo $CI_REGISTRY_PASSWORD | docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password-stdin", "docker load --input $ARCHIVE"]
  script:
    - docker push "$IMAGE"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$IMAGE" "$LATEST_IMAGE" && docker push "$LATEST_IMAGE"; fi
publish_backend_image:
  extends: .publish
  needs: [{job: build_backend_image, artifacts: true}, {job: scan_backend_image}]
  variables: {IMAGE: "$BACKEND_IMAGE", LATEST_IMAGE: "$CI_REGISTRY_IMAGE/backend:latest", ARCHIVE: backend-image.tar}
publish_web_image:
  extends: .publish
  needs: [{job: build_web_image, artifacts: true}, {job: scan_web_image}]
  variables: {IMAGE: "$WEB_IMAGE", LATEST_IMAGE: "$CI_REGISTRY_IMAGE/web:latest", ARCHIVE: web-image.tar}

deploy_staging:
  stage: deploy
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
  when: manual
  environment: {name: staging}
  needs: [publish_backend_image, publish_web_image]
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH"
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh && printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && BACKEND_IMAGE='$BACKEND_IMAGE' WEB_IMAGE='$WEB_IMAGE' docker compose -f docker-compose.staging.yml pull && BACKEND_IMAGE='$BACKEND_IMAGE' WEB_IMAGE='$WEB_IMAGE' docker compose -f docker-compose.staging.yml up -d --remove-orphans"

pages:
  stage: deploy
  image: node:22-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "HuyND"'
    - if: '$CI_COMMIT_BRANCH == "ChuongBD"'
    - if: '$CI_COMMIT_BRANCH == "PhuongNT"'
    - if: '$CI_COMMIT_BRANCH == "LamVH1"'
    - if: '$CI_COMMIT_BRANCH == "BachNQ1"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd 05_Development/CareBridgeWebApp
    - npm ci
    - npm run build
    - cd ../..
    - rm -rf public
    - mkdir public
    - cp -r 05_Development/CareBridgeWebApp/dist/* public/
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public

